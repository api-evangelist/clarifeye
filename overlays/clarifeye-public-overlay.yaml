overlay: 1.0.0
info:
  title: API Evangelist enhancements for Clarifeye Public API
  version: 1.0.0
extends: openapi/clarifeye-openapi-original.yaml
actions:
- target: $.info
  update:
    x-apievangelist-enriched: '2026-07-18'
    x-api-surface: public
    x-mcp-server: https://eu.app.clarifeye.ai/mcp
    x-well-known: /.well-known/oauth-authorization-server
    x-error-format: 'flat {"error": "..."} — not RFC 9457'
    x-pagination: page-number (count/next/previous/results)
- target: $.info
  update:
    x-apievangelist-categories:
    - Artificial Intelligence
    - Knowledge Management
    - Model Context Protocol
    - Document Intelligence
