openapi: 3.2.0
info:
  title: Clarifeye Platform API — Full API Documentation Interviews…
  description: 'Complete REST API reference for the Clarifeye Platform.


    Documents every endpoint exposed by the platform — the public surface plus

    the advanced surface: pipeline customization (extraction flows, pipeline

    runs, warehouse tables, document tag/metadata configuration), the pre-MCP

    AI surface (agent settings, playground conversations, conversation-scoped

    feedback views, notifications), and the impersonation header. New AI

    integrations should consume knowledge via MCP rather than the

    conversation/agent-settings endpoints documented here.


    ## Authentication

    All endpoints require authentication. Include the Authorization header in every request using either format:

    - `Authorization: Token `

    - `Authorization: Bearer `


    ## Service accounts and API keys

    Integrations authenticate with an **API key** of a **service account**:

    - `Authorization: Bearer ` (keys start with `cfk_`)


    A service account is an ordinary member (role `member`) of one organization that cannot log

    in. Organization admins create it and mint its keys on the organization''s *Service

    accounts* page (`/organizations/{id}/service-accounts/`, `/organization-api-keys/`), and

    give it access to knowledge stores with ordinary store permissions. A key is valid on every

    endpoint and acts as its service account: it reaches exactly the stores, with exactly the

    rights, the account was given. An account can hold several keys (each with its own name,

    optional expiry and revocation), so a key can be rotated without changing identity.


    A refused key answers **403** with one of: `Invalid API key.`, `API key revoked.`,

    `API key expired.`, `API key disabled.` (the service account is disabled).


    Any valid key may also call `POST /organizations/{id}/provision-user/` and

    `POST /organizations/{id}/deprovision-user/` for its own organization (the `{id}` in the

    path must be the key''s organization). The email domains these may pre-create accounts for

    are configured by Clarifeye on the organization (`allowed_provisioning_domains`).


    ## Impersonation


    Certain endpoints support user impersonation for creating or listing data on behalf of other users.

    This is useful for integrating external systems that need to attribute actions to specific users.


    **Header:** `X-Impersonate-Email`


    **Required Permission:** `CAN_IMPERSONATE_OTHER_USERS` (for a person, contact Clarifeye to enable it; org admins grant it to a service account on the organization''s Service accounts page)


    **Behavior:**

    - If the header is provided and the impersonator has the required permission, the action is performed as the target user

    - If the target user is not found, the request proceeds as the original authenticated user

    - If the target user does not have access to the project, the request proceeds as the original authenticated user

    - If the impersonator lacks the `CAN_IMPERSONATE_OTHER_USERS` permission, the header is ignored


    **With an API key** the request fails instead (**403**) whenever impersonation cannot

    happen: missing permission, unknown target, target without access to the store, target that

    is itself a service account, or an endpoint outside a store. A key never silently acts as

    its own service account when impersonation was asked for.'
  version: 1.0.0
  contact:
    name: Clarifeye Support
servers:
- url: https://eu.app.clarifeye.ai/api/v1
  description: EU
- url: https://us.app.clarifeye.ai/api/v1
  description: US
security:
- BearerAuth: []
- TokenAuth: []
tags:
- name: Interviews
  description: Assign and review structured interview conversations
paths:
  /projects/{project_id}/interviews/:
    get:
      tags:
      - Interviews
      summary: List interviews
      description: 'Retrieve interviews for a project.


        - Admins see all interviews in the project.

        - Other members see only interviews assigned to them or that they created.


        Results are ordered newest first, with interviews of the same campaign kept

        contiguous (a campaign sorts by its own creation date, a campaign-less

        interview by its own) — which is what lets clients render collapsible

        campaign groups across pages.'
      operationId: listInterviews
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: assigned_to
        in: query
        description: Set to "me" to return only interviews assigned to (or created by) the requesting user.
        schema:
          type: string
          enum:
          - me
      - name: created_by
        in: query
        description: Set to "me" to return only interviews the requesting user created (whoever they were assigned to).
        schema:
          type: string
          enum:
          - me
      - name: status
        in: query
        description: Filter by status. Comma-separated for multiple values (e.g. "pending,in_progress").
        schema:
          type: string
      - name: type
        in: query
        description: 'Filter by conversation type. `interview` returns every interview type

          (standard, guided, onboarding, imported) and no meetings; `meeting`

          returns the meetings Clara attended (present only once the call is over

          and transcribed — a live meeting has no conversation yet); any other value

          is matched exactly (e.g. `imported-interview`, `onboarding`). Omitting it

          lists everything except meetings and Clara Fast sessions, which have their

          own pages; both remain retrievable by id.

          '
        schema:
          type: string
      - name: campaign
        in: query
        description: 'Filter by campaign: a campaign UUID for that campaign''s interviews, or

          the literal "none" for interviews without a campaign.

          '
        schema:
          type: string
      - name: text
        in: query
        description: Case-insensitive search over the interview name and transcript.
        schema:
          type: string
      - name: ordering
        in: query
        description: 'Sort order. Omit for the default: newest first, where an interview in a

          campaign sorts by its campaign''s creation date (keeping a campaign''s

          interviews together) and a campaign-less one by its own.


          `status` sorts unfinished interviews first and completed ones last,

          newest first within each — intended for listing one campaign''s

          interviews, where "who still hasn''t finished" is the question.

          '
        schema:
          type: string
          enum:
          - status
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginatedResponse'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/InterviewListItem'
                    status_counts:
                      type: object
                      description: 'Number of interviews per status across the whole filtered set

                        (not just the returned page). Keys are the status values

                        ("pending", "in_progress", "completed"); legacy conversations

                        without a status are counted under "none". Absent keys mean zero.

                        '
                      additionalProperties:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/interviews/search-transcripts/:
    get:
      tags:
      - Interviews
      summary: Search interview transcripts
      description: 'Keyword search over interview transcripts, returning short snippets that

        point at where something was said (agent-oriented: read the interview

        itself for the full context).


        The query is split into whitespace-separated keywords; a message matches

        when it contains any term (case-insensitive substring), so extra words

        broaden rather than narrow the search and there is no phrase matching.

        Punctuation is stripped from each term''s edges, and stopwords and

        single-character terms are dropped — a query consisting only of those is

        rejected with 400. Only conversational message turns are searched —

        tool-call payloads and reasoning entries never match. Hits are ranked by distinct terms

        matched, then interview recency, and capped at 3 per interview and

        30 in total. All interview conversation types (onboarding, interview,

        guided-interview, imported-interview) are always searched. Visibility

        scoping matches the interviews list (non-admins only search their own

        or assigned interviews).'
      operationId: searchInterviewTranscripts
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: query
        in: query
        required: true
        description: Search keywords (whitespace-separated; a message matches any term). Minimum 2 characters; stopwords and single-character terms are ignored.
        schema:
          type: string
      - name: campaign
        in: query
        description: 'Filter by campaign: a campaign UUID, or "none" for interviews without a campaign.'
        schema:
          type: string
      - name: interview_ids
        in: query
        description: Comma-separated interview UUIDs to search within.
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  query:
                    type: string
                  terms:
                    type: array
                    description: The parsed search terms (unique, lowercased).
                    items:
                      type: string
                  count_interviews_matched:
                    type: integer
                    description: Interviews with at least one matching message (before the total-hit cap).
                  interviews_scanned:
                    type: integer
                    description: Candidate interviews whose transcripts were examined.
                  scan_limit_reached:
                    type: boolean
                    description: 'True when more interviews matched the prefilter than could be

                      scanned, so older ones were not examined at all and matches may

                      be missing entirely (not merely trimmed).

                      '
                  truncated:
                    type: boolean
                    description: True when more matches exist than were returned (per-interview cap, total cap, or scan bound reached).
                  hits:
                    type: array
                    items:
                      type: object
                      properties:
                        interview_id:
                          type: string
                          format: uuid
                        interview_name:
                          type:
                          - string
                          - 'null'
                        type:
                          type: string
                        status:
                          type:
                          - string
                          - 'null'
                        campaign:
                          type:
                          - object
                          - 'null'
                          properties:
                            id:
                              type: string
                              format: uuid
                            name:
                              type: string
                        role:
                          type:
                          - string
                          - 'null'
                        speaker:
                          type: string
                          description: Speaker name (imported transcripts only).
                        timestamp:
                          type:
                          - string
                          - 'null'
                        query_id:
                          type:
                          - integer
                          - 'null'
                          description: Message identifier within the transcript, matching chat_history entries.
                        snippet:
                          type: string
                          description: ~300-char window around the first matched term, ellipsis-trimmed.
                        matched_terms:
                          type: array
                          items:
                            type: string
                        interview_total_matches:
                          type: integer
                          description: Matching messages in this interview (at most 3 become hits).
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/interviews/assign/:
    post:
      tags:
      - Interviews
      summary: Create and assign interviews
      description: 'Create and assign one interview per assignee. **Admin only.**


        Provide existing project members via `assignee_ids` and/or new people to

        invite via `invite_emails` (at least one is required). Invitees are added

        as non-admin Contributors. A separate interview is created for each

        assignee and the response is the list of created interviews.


        `scheduled_send_at` delays only the invitation email — interviews are

        created and visible in-app immediately. `reminders` configures automatic

        chase emails that run until the interview is completed, the cap is

        reached, or an admin stops them.


        `draft_id` marks this send as consuming a saved interview draft: the

        draft is deleted in the same transaction, and its stored title is reused

        when the sent topic still matches the draft''s.


        `interview_type: "guided-interview"` creates guided (multi-topic

        deep-dive) conversations structured by `topics` — an ordered list of

        `{title, description, skill_id}` seeded as conversation-scoped topics at

        send time (at least one is required). With a `draft_id`, the draft''s

        type is authoritative (immutable), while payload `topics` override the

        draft''s saved list — the form may hold unsaved edits at send time.

        Guided sends reject `questions`: the topics structure the conversation,

        so must-cover points belong in the `topic` (focus) text.


        `campaign_id` / `campaign_name` group the created interviews under an

        interview campaign (e.g. a workshop wave). `campaign_id` picks an existing

        campaign; `campaign_name` reuses the project''s campaign with that name

        (case-insensitive) or creates it. When both are absent the send falls back

        to the consumed draft''s saved campaign; an explicit `campaign_id: null`

        clears a drafted campaign.'
      operationId: assignInterviews
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assignee_ids:
                  type: array
                  description: UUIDs of existing project members to interview (must be tech/contributor members).
                  items:
                    type: string
                    format: uuid
                invite_emails:
                  type: array
                  description: Email addresses of people to invite on the fly as non-admin Contributors and assign an interview.
                  items:
                    type: string
                    format: email
                topic:
                  type: string
                  description: The interview focus. Used to auto-name the interview and seed its first question.
                instructions:
                  type: string
                  maxLength: 4000
                  description: 'Guided interviews only: the organiser''s rules for how Clara runs the

                    session (see `InterviewDraftInput.instructions`). Stored on every

                    created interview as `type_additional_parameters.interview_instructions`

                    and rendered into the interviewer''s prompt; never sent to respondents.

                    When a `draft_id` is set and this key is absent, the draft''s value is

                    used.

                    '
                questions:
                  type: array
                  description: 'Optional specific topics or questions (max 10). Clara weaves them naturally

                    into the open interview and covers each before closing the topic.

                    '
                  items:
                    type: string
                language:
                  type:
                  - string
                  - 'null'
                  description: 'ISO language code (e.g. `fr`) the interview must be conducted in. Null

                    adapts to each recipient''s own preferred language. When a `draft_id` is

                    set and this field is absent, defaults to the draft''s value. Unknown

                    codes are rejected (400).

                    '
                custom_message:
                  type: string
                  description: Optional note from the assigner; replaces the default invitation email copy.
                custom_focus:
                  type:
                  - string
                  - 'null'
                  description: 'Overrides the "what it''s about" focus block in invitation emails without

                    changing the actual interview focus. Null shows the topic truncated to a

                    teaser; empty string removes the block; text is shown verbatim. When the

                    key is absent, a `draft_id` send reuses the draft''s saved value.

                    '
                  maxLength: 500
                artifacts:
                  type: array
                  items:
                    $ref: '#/components/schemas/InterviewArtifactSelection'
                  description: 'The artifacts the interviewer gets, each with whether the respondent can

                    open it (see `InterviewDraft`). When the key is absent, a `draft_id` send

                    reuses the draft''s selection; with neither, the interviews get no

                    artifacts.

                    '
                scheduled_send_at:
                  type:
                  - string
                  - 'null'
                  format: date-time
                  description: Optional future time to send the invitation email (in-app visibility stays immediate).
                reminders:
                  type: object
                  description: Automatic reminder settings (disabled by default).
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    start_after_days:
                      type: integer
                      default: 2
                      minimum: 1
                      maximum: 30
                    interval_days:
                      type: integer
                      default: 3
                      minimum: 1
                      maximum: 30
                    max_count:
                      type: integer
                      default: 3
                      minimum: 1
                      maximum: 10
                interview_type:
                  type: string
                  enum:
                  - interview
                  - guided-interview
                  default: interview
                  description: 'Conversation type to create. Ignored when `draft_id` is set (the

                    draft''s type is authoritative).

                    '
                topics:
                  type: array
                  description: 'Guided interviews only: the ordered topics the interview walks

                    through (max 12, at least one required for guided sends). Overrides

                    a consumed draft''s saved topics when provided.

                    '
                  items:
                    $ref: '#/components/schemas/GuidedInterviewTopic'
                draft_id:
                  type:
                  - string
                  - 'null'
                  format: uuid
                  description: 'Optional id of a saved interview draft this send consumes. Rejected

                    (400) when the draft no longer exists (already sent or deleted).

                    '
                campaign_id:
                  type:
                  - string
                  - 'null'
                  format: uuid
                  description: 'Existing campaign to group the created interviews under (must belong

                    to the project). Absent falls back to the consumed draft''s saved

                    campaign; an explicit null clears a drafted campaign. Wins over

                    `campaign_name` when both are sent.

                    '
                campaign_name:
                  type: string
                  description: 'Campaign to group the created interviews under, by name: reuses the

                    project''s campaign with that name (case-insensitive) or creates it.

                    '
            example:
              assignee_ids:
              - 3fa85f64-5717-4562-b3fc-2c963f66afa6
              invite_emails:
              - newperson@example.com
              topic: Q4 planning and roadmap review
              questions:
              - How do you weigh team vs. market vs. traction?
              custom_message: We're building a shared playbook — your instincts are the point.
              reminders:
                enabled: true
                start_after_days: 2
                interval_days: 3
                max_count: 3
      responses:
        '201':
          description: Interviews created and assigned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Interview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/interviews/assignable-users/:
    get:
      tags:
      - Interviews
      summary: List assignable users
      description: 'List project members who can be assigned an interview (tech/contributor

        profiles and pending tech/contributor invites), flagging admins. **Admin only.**'
      operationId: listAssignableInterviewUsers
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type:
                          - string
                          - 'null'
                          format: uuid
                          description: Member user id; null for a pending invite.
                        email:
                          type: string
                          format: email
                        is_admin:
                          type: boolean
                        pending_invite:
                          type: boolean
                          description: True when this is a not-yet-accepted invite rather than a joined member.
                  non_interviewable_emails:
                    type: array
                    description: 'Emails of members who exist but can''t be interviewed (data readers).

                      Out-of-process callers use this to refuse such recipients up front

                      instead of failing the whole batch at send.

                      '
                    items:
                      type: string
                      format: email
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/interviews/{interview_id}/stop-reminders/:
    post:
      tags:
      - Interviews
      summary: Stop automatic reminders
      description: 'Permanently stop automatic reminder emails for one interview. **Admin or

        assigner only.** Manual reminders stay available; reminders also stop on

        completion or deletion. Returns 400 when the interview has no reminder schedule.'
      operationId: stopInterviewReminders
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: interview_id
        in: path
        required: true
        description: UUID of the interview
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Reminders stopped
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: reminders_stopped
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/interviews/{interview_id}/send-now/:
    post:
      tags:
      - Interviews
      summary: Send a scheduled invitation now
      description: 'Send a scheduled-but-unsent interview invitation immediately, skipping the

        remaining wait on `scheduled_send_at`, and start the reminder clock. **Admin

        or assigner only.** Returns 400 when the interview is not an interview, has

        already been started, or its invitation was already sent.'
      operationId: sendInterviewInvitationNow
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: interview_id
        in: path
        required: true
        description: UUID of the interview
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Invitation sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: invitation_sent
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/interviews/feed/:
    get:
      tags:
      - Interviews
      summary: List the interviews feed
      description: 'The admin interviews page as one pageable list: each campaign is a single

        row carrying its progress aggregates, and campaign-less interviews are

        plain rows. Rows interleave newest first, a campaign sorting at its own

        creation date and a standalone interview at its own — the same order the

        interviews list uses. Campaigns without interviews are not listed.


        **Admin only.** Filters are not supported here: a filtered or searched

        view is served by the interviews list.'
      operationId: listInterviewsFeed
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginatedResponse'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/InterviewFeedItem'
                    status_counts:
                      type: object
                      description: 'Number of interviews per status across every interview in the

                        project, campaign or not (not just the returned page). Keys are

                        the status values; legacy conversations without a status are

                        counted under "none". Absent keys mean zero.

                        '
                      additionalProperties:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/interviews/{interview_id}/:
    get:
      tags:
      - Interviews
      summary: Retrieve interview content
      description: 'Retrieve a single interview with its full content, including the

        complete `chat_history` transcript and `chat_memory`.


        Non-admins can only retrieve interviews assigned to them or that they

        created; admins can retrieve any interview in the project.'
      operationId: getInterview
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: interview_id
        in: path
        required: true
        description: UUID of the interview
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Interviews
      summary: Update an interview
      description: 'Partially update an interview''s writable fields — most usefully `name`

        (rename) and `campaign_id` (move the interview to another campaign of the

        project, or null to remove it from its campaign, so past interviews can be

        re-bucketed retroactively). Lifecycle and transcript fields are read-only.'
      operationId: updateInterview
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: interview_id
        in: path
        required: true
        description: UUID of the interview
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Interview'
      responses:
        '200':
          description: Interview updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/interviews/{interview_id}/artifacts/:
    get:
      tags:
      - Interviews
      summary: Artifacts shown beside an interview
      description: 'The knowledge-store artifacts the interview''s draft chose to show its respondent,

        read-only, at the latest versions the interviewer''s prompt reads (CLA-1931).

        Readable by the respondent (interview-only access is enough) and by data readers.


        Only the selected artifacts marked `show_to_respondent`. Empty when none are,

        when the draft chose none, for interviews sent before the selection existed and

        for onboarding — none of these show an artifact panel.'
      operationId: listInterviewArtifacts
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: interview_id
        in: path
        required: true
        description: UUID of the interview
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The artifacts, in catalog order
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                  - $ref: '#/components/schemas/ArtifactSummary'
                  - type: object
                    properties:
                      payload:
                        description: The artifact content (head version), shaped by its technical_type.
        '404':
          description: Not found, or not an interview the caller can open.
  /projects/{project_id}/interviews/{interview_id}/duplicate-as-draft/:
    post:
      tags:
      - Interviews
      summary: Duplicate an interview as a draft
      description: 'Duplicate one interview into a fresh, unsent draft. **Admin only.**


        The draft copies the interview''s content and send settings (focus topic,

        questions or guided topics, language, custom

        message, reminder settings, campaign); recipients, transcript, schedule,

        and lifecycle state are not copied — pick recipients on the draft and send

        it via the assign endpoint. Nothing is sent by this call. Only standard and

        guided interviews can be duplicated — imported transcripts return 400.'
      operationId: duplicateInterviewAsDraft
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: interview_id
        in: path
        required: true
        description: UUID of the interview to duplicate
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Draft created from the interview
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
