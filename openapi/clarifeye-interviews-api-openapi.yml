  /projects/{project_id}/coach-conversations/{coach_conversation_id}/feedback/:
    post:
      tags:
      - Interviews
      summary: Submit post-interview feedback
      description: 'Record the interviewee''s rating of a completed interview (types

        `interview` and `guided-interview` only). Only the assignee of the

        interview can submit; each interview accepts feedback once (a second

        submission returns 400). Declining to answer is not persisted — the

        client simply asks again on a later visit.


        The grade and comment are Clarifeye-internal quality signals — they are

        not exposed back through the API; conversations only report a

        `feedback_state` of `none`/`submitted`.'
      operationId: submitInterviewFeedback
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: coach_conversation_id
        in: path
        required: true
        description: UUID of the interview (coach conversation)
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - grade
              properties:
                grade:
                  type: integer
                  minimum: 1
                  maximum: 5
                  description: Overall rating of the interview
                comment:
                  type: string
                  description: Optional free-form comment
      responses:
        '200':
          description: Feedback recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  feedback_state:
                    type: string
                    enum:
                    - submitted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/interviews/import-transcript/:
    post:
      tags:
      - Interviews
      summary: Import an external interview transcript
      description: 'Import the transcript of an interview recorded outside the platform (e.g. a

        Granola/Teams/Zoom export). **Admin only.**


        Creates a read-only interview (type "imported-interview") holding the raw text

        and enqueues an async parse that turns it into speaker-labeled `chat_history`

        messages (each carrying a `speaker` name) plus inferred metadata. The response

        returns immediately with `import_info.import_status = "parsing"`; poll the

        interview detail endpoint until it is "ready" (`status` becomes "completed")

        before reading the transcript. All metadata fields are optional — anything

        omitted is inferred from the transcript; importer-supplied values always win.'
      operationId: importInterviewTranscript
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - transcript
              properties:
                transcript:
                  type: string
                  description: The full raw transcript text, verbatim (200 to 1,500,000 characters).
                title:
                  type: string
                  description: Optional interview title.
                interview_date:
                  type: string
                  format: date
                  description: Optional date the interview happened (YYYY-MM-DD).
                participants:
                  type: array
                  description: Optional participant names.
                  items:
                    type: string
      responses:
        '201':
          description: Interview created; parsing in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/interviews/{interview_id}/retry-import/:
    post:
      tags:
      - Interviews
      summary: Retry a failed transcript import
      description: 'Re-run the async parse of an imported transcript. **Admin only.**


        Allowed when the import failed, or when it has been stuck in "parsing" long

        enough (~15 minutes) that the worker evidently died. Returns 400 for other

        states and for non-imported interviews.'
      operationId: retryInterviewTranscriptImport
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: interview_id
        in: path
        required: true
        description: UUID of the imported interview
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Parse re-enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/interviews/{interview_id}/translate/:
    post:
      tags:
      - Interviews
      summary: Translate an interview transcript
      description: 'Machine-translate the transcript''s message bubbles into a language, for

        reviewers who do not read the interview''s language. Translations are cached

        per language and reused; the call is idempotent: only messages not yet cached

        in that language are translated (so re-posting on an in-progress interview

        fills in the new turns) and a run already in flight is joined rather than

        duplicated. Returns 202 while the translation is running and 200 once it is

        complete; poll the `translations` endpoint for progress. Interview types

        (`interview`, `guided-interview`, `imported-interview`) only. The translation

        never appears in the interview payload itself — only the language codes of

        complete translations do (`available_translations`).'
      operationId: translateInterviewTranscript
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: interview_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - language
              properties:
                language:
                  type: string
                  description: ISO language code to translate into (e.g. `fr`, `pt-br`). Unknown codes are rejected (400).
      responses:
        '200':
          description: Translation complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewTranscriptTranslation'
        '202':
          description: Translation running (newly started or already in flight)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewTranscriptTranslation'
        '400':
          description: Unknown language code, or the conversation is not an interview
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/interviews/{interview_id}/translations/:
    get:
      tags:
      - Interviews
      summary: Get a cached transcript translation
      description: 'The cached translation of the transcript in one language, as started by the

        `translate` endpoint. `translations` maps each message''s key to its translated

        text (see `InterviewTranscriptTranslation`); `translated_count` / `total_count`

        track progress while `status` is `running`.'
      operationId: getInterviewTranscriptTranslation
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: interview_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: language
        in: query
        required: true
        schema:
          type: string
        description: ISO language code of the translation to fetch.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewTranscriptTranslation'
        '400':
          description: Missing or unknown language code
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No translation in this language yet (call `translate` first)
  /projects/{project_id}/interview-drafts/:
    get:
      tags:
      - Interviews
      summary: List interview drafts
      description: 'List the project''s saved-but-unsent interview drafts, most recently

        updated first. **Admin only** (like everything pre-send).


        `view=summary` returns overview rows (`InterviewDraftSummary`) instead of

        full drafts — what agent tools list; read a full draft with the detail

        endpoint.'
      operationId: listInterviewDrafts
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - name: view
        in: query
        required: false
        description: '`summary` for overview rows; omit for full drafts.'
        schema:
          type: string
          enum:
          - summary
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginatedResponse'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        anyOf:
                        - $ref: '#/components/schemas/InterviewDraft'
                        - $ref: '#/components/schemas/InterviewDraftSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Interviews
      summary: Create an interview draft
      description: 'Save a draft of an interview assignment. **Admin only.**


        A draft holds the whole assignment payload but creates no interviews and

        sends nothing — it only becomes real interviews when a human sends it via

        the assign endpoint (passing `draft_id`). Validation is deliberately

        permissive: every field is optional, recipients may be stale, and the

        schedule may be in the past — the real rules apply at send time. This is

        the endpoint LLM tools use, precisely because it cannot trigger email.


        When a `topic` is provided without a `name`, a short title is generated

        from it and returned as `name` (regenerated whenever the topic changes on

        update, until the draft is renamed).'
      operationId: createInterviewDraft
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterviewDraftInput'
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewDraft'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/interview-drafts/{draft_id}/:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    - name: draft_id
      in: path
      required: true
      description: UUID of the interview draft
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Interviews
      summary: Retrieve an interview draft
      description: Retrieve one saved draft. **Admin only.**
      operationId: getInterviewDraft
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewDraft'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Interviews
      summary: Update an interview draft
      description: 'Partially update a saved draft. **Admin only.** Sending `name` renames

        the draft, and later topic changes keep that name; `name: ""` returns it

        to a title generated from the topic. Otherwise changing the topic

        regenerates the draft''s `name`, and clearing it clears the name.'
      operationId: updateInterviewDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterviewDraftInput'
      responses:
        '200':
          description: Draft updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewDraft'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Interviews
      summary: Delete an interview draft
      description: 'Discard a saved draft. **Admin only.** Nothing was sent, so deleting a

        draft has no side effects. Sending a draft (assign with `draft_id`)

        deletes it automatically.'
      operationId: deleteInterviewDraft
      responses:
        '204':
          description: Draft deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/interview-drafts/topic-skills/:
    get:
      tags:
      - Interviews
      summary: List guided-interview topic types
      description: 'The topic types (`skill_id` values) a guided draft''s topics may carry, with the

        human-facing label and one-line description the new-interview form shows in its

        type picker. **Admin only.** `selectable` says whether a human may pick the type

        in the form; non-selectable entries (`custom_topic`, i.e. "no skill") are listed

        so existing drafts can label what they carry. Fixed, unpaginated list.'
      operationId: listGuidedInterviewTopicSkills
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: The topic-type palette.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GuidedInterviewTopicSkill'
        '403':
          $ref: '#/components/responses/Forbidden'
  /projects/{project_id}/interview-drafts/{draft_id}/test-runs/:
    post:
      tags:
      - Interviews
      summary: Start a test run of an interview draft
      description: 'Rehearse a draft before sending it (CLA-1834). **Admin only.** Creates an

        ordinary interview conversation of the draft''s type — same prompt, tools and

        page as a real interview — assigned to the requesting user, linked to the draft

        (`test_of_draft`) and hidden from every interview list, count and search. No

        invitation, email, notification or interview analytics are produced; the run is

        deleted with the draft (sending a draft deletes it). The draft is not modified.


        `start_topic_index` (guided drafts) opens the run on that topic: earlier topics

        are seeded but marked `skipped`, the interview opener is assumed to have already

        happened (the first-message flow is skipped), and the run''s first turn is a

        system note telling the interviewer to resume on that topic — so the run reads

        as a real interview would at that point. `language` is the language the run is

        conducted in and — unlike a real interview — outranks the tester''s own

        preference; null keeps auto-detection.


        During the run, the stream endpoint accepts `jump_to_topic_id` (a later open

        topic of the run) to skip ahead: the topics in between are marked skipped and

        the interviewer is told to transition on that turn.'
      operationId: createInterviewDraftTestRun
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: draft_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                language:
                  type:
                  - string
                  - 'null'
                  description: ISO language code the run is conducted in; null = auto-detect.
                  example: fr
                start_topic_index:
                  type: integer
                  minimum: 0
                  default: 0
                  description: 0-based index into the draft's `topics`; guided drafts only.
      responses:
        '201':
          description: Test run created
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation_id:
                    type: string
                    format: uuid
                  interview_url:
                    type: string
                    description: Absolute URL of the focused interview page to open (`…/interview/{project_id}/{conversation_id}`).
        '400':
          description: Draft not runnable (no focus / no topics, bad start index or language)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/interview-drafts/{draft_id}/local-documents/:
    get:
      tags:
      - Interviews
      summary: List a draft's reference documents
      description: 'The documents the interviewer attached to a draft to frame the interview

        (CLA-1887). **Admin only.** Each is a `LocalDocument` with `source: reference`;

        while `processing_status` is not `completed`/`failed` the parser is still working

        and the draft cannot be sent or tested (assign / test-runs return 409).


