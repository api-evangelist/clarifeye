                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/LocalDocument'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
