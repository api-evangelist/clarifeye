        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/interview-campaigns/{campaign_id}/:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    - name: campaign_id
      in: path
      required: true
      description: UUID of the interview campaign
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Interviews
      summary: Retrieve an interview campaign
      description: Retrieve one campaign with its progress aggregates. **Admin only.**
      operationId: getInterviewCampaign
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewCampaign'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Interviews
      summary: Rename an interview campaign
      description: 'Rename a campaign. **Admin only.** `name` is the only writable field —

        campaigns cannot be created or deleted through the API. Names are unique

        per project, case-insensitively; a clash returns 400.'
      operationId: renameInterviewCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  description: New campaign name (trimmed; must be unique in the project)
      responses:
        '200':
          description: Campaign renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewCampaign'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/interview-campaigns/{campaign_id}/remind-all/:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    - name: campaign_id
      in: path
      required: true
      description: UUID of the interview campaign
      schema:
        type: string
        format: uuid
    post:
      tags:
      - Interviews
      summary: Remind every unfinished interview in a campaign
      description: 'Send a reminder (or a "finish your interview" nudge for in-progress ones)

        to the assignee of each unfinished interview in the campaign. **Admin

        only.**


        Ineligible interviews are skipped rather than failing the batch:

        completed interviews, imported transcripts, interviews with no assignee,

        interviews assigned to the caller, and interviews whose scheduled

        invitation has not been sent yet (use the interview''s send-now action for

        those).'
      operationId: remindAllInterviewCampaign
      responses:
        '200':
          description: Reminders dispatched
          content:
            application/json:
              schema:
                type: object
                properties:
                  reminded:
                    type: integer
                    description: Number of interviews a reminder was sent for
                  skipped:
                    type: integer
                    description: Number of unfinished interviews that were not eligible
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    InterviewArtifactSelection:
      type: object
      required:
      - slug
      properties:
        slug:
          type: string
          description: An in-scope artifact slug.
        show_to_respondent:
          type: boolean
          default: false
          description: 'Whether the respondent can also open this artifact, read-only, beside the chat

            (`GET .../interviews/{id}/artifacts/`). False keeps it as the interviewer''s

            background only.

            '
    ReferenceDocumentsAttachResult:
      type: object
      properties:
        attached:
          type: array
          items:
            $ref: '#/components/schemas/LocalDocument'
        skipped:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type:
                - string
                - 'null'
              reason:
                type: string
    InterviewInviteConfig:
      type: object
      description: 'Invitation-email customization and reminder schedule for an assigned interview.

        Null for self-assigned interviews, non-interview conversations, and interviews

        created before this feature existed.

        '
      readOnly: true
      properties:
        custom_message:
          type: string
          description: The assigner's note; replaces the default invitation email copy when set.
        custom_focus:
          type:
          - string
          - 'null'
          description: 'The assigner''s override of the email''s "what it''s about" focus block. Null

            means not customised (emails show the truncated topic); empty string means

            the block was removed; text is shown verbatim.

            '
        scheduled_send_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the invitation email is (or was) due to be sent. Null means it was sent immediately.
        invitation_email_sent_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the invitation email actually went out; null while a scheduled send is still pending.
        reminders_enabled:
          type: boolean
        reminder_start_after_days:
          type: integer
        reminder_interval_days:
          type: integer
        reminder_max_count:
          type: integer
        reminders_sent:
          type: integer
          description: Automatic reminders sent so far (manual reminders are not counted).
        next_reminder_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the next automatic reminder is due; null when none is scheduled.
        reminders_stopped:
          type: boolean
          description: True once an admin/assigner stopped the schedule via stop-reminders.
    ImportedInterviewInfo:
      type: object
      description: 'Parse-pipeline state of an imported external transcript (interviews of type

        "imported-interview"). Null on every other interview type. The raw pasted

        transcript is never returned — the parsed `chat_history` is the transcript.

        '
      properties:
        import_status:
          type: string
          enum:
          - parsing
          - ready
          - failed
          description: '"parsing" while the async parse runs (transcript not yet readable),

            "ready" once chat_history holds the speaker-labeled turns (status becomes

            "completed"), "failed" when parsing errored (use retry-import).

            '
        participants:
          type: array
          description: Participant names (importer-supplied or inferred from the transcript).
          items:
            type: string
        interview_date:
          type:
          - string
          - 'null'
          format: date
          description: Date the conversation happened (importer-supplied or inferred).
        error:
          type:
          - string
          - 'null'
          description: Failure detail when import_status is "failed".
    PaginatedResponse:
      type: object
      properties:
        count:
          type: integer
          description: Total number of results
        next:
          type:
          - string
          - 'null'
          format: uri
          description: URL to next page of results
        previous:
          type:
          - string
          - 'null'
          format: uri
          description: URL to previous page of results
        results:
          type: array
          items: {}
    InterviewTestRun:
      type: object
      description: 'A rehearsal of an unsent draft (CLA-1834): an ordinary interview conversation

        the admin plays through themselves, listed only under its draft and removed

        with it. Topics in `skipped_topic_ids` were deliberately left out of the run

        (started later / jumped ahead) — they are choices, not gaps. On a conversation

        detail (`test_run`) the object additionally carries `draft_id`, `draft_name`,

        `draft_edit_url`, `draft_source_session` and a `note` for agent readers.

        '
      properties:
        id:
          type: string
          format: uuid
        status:
          type:
          - string
          - 'null'
          enum:
          - pending
          - in_progress
          - completed
        language:
          type:
          - string
          - 'null'
          description: ISO code the run is conducted in (outranks the tester's preference); null = auto-detect.
        started_from_topic_index:
          type: integer
        started_from_topic_title:
          type:
          - string
          - 'null'
        skipped_topic_ids:
          type: array
          items:
            type: string
            format: uuid
        jumps:
          type: array
          items:
            type: object
            properties:
              from_topic_id:
                type:
                - string
                - 'null'
                format: uuid
              to_topic_id:
                type: string
                format: uuid
              at_message_count:
                type: integer
        message_count:
          type: integer
          description: Conversation-detail flavour only (drafts list runs without their transcripts).
        draft_changed_since_start:
          type: boolean
          description: 'The draft''s interview-shaping fields (focus, topics, questions, language)

            changed after this run began — it rehearsed a previous version. Re-saving the

            draft unchanged, or starting another run, does not set it.

            '
        interview_url:
          type: string
          description: Absolute URL of the run's focused interview page.
        draft_source_session:
          allOf:
          - $ref: '#/components/schemas/InterviewDraftSourceSession'
          description: Conversation-detail flavour only. The session that drafted the interview, so the test page can resume it for feedback.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    GuidedInterviewTopic:
      type: object
      description: 'One ordered topic of a guided interview. `title` and `description` say what THIS

        topic must cover; `skill_id` is its TYPE — how the interviewer works it — and

        round-trips through edits, so preserve the values you received or the topic loses

        its skill-backed interview depth. Accepted values are the interview skills

        (`use_case_exploration`, `use_case_context`, `document_library`,

        `document_upload`, `checklist`, `custom_topic`, `guided_wrap_up`, plus ids retired from new

        agendas but still carried by older drafts); an unrecognized id is rejected with

        400. Omit `skill_id` for a free-form topic, driven by its own title/description

        text — such a topic must then carry a non-empty `description` (400 otherwise);

        a skill-backed topic may leave it blank.

        '
      required:
      - title
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
        skill_id:
          type:
          - string
          - 'null'
    InterviewCampaign:
      type: object
      description: 'A named group of interviews (a "wave"), with the progress aggregates the

        interviews page renders. Counts cover every interview in the campaign.

        '
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Unique within the project, case-insensitively.
        created_at:
          type: string
          format: date-time
          readOnly: true
        interview_count:
          type: integer
          readOnly: true
          description: 'Total interviews in the campaign. May exceed the sum of the per-status

            counts: interviews created before statuses existed have none.

            '
        completed_count:
          type: integer
          readOnly: true
        in_progress_count:
          type: integer
          readOnly: true
        pending_count:
          type: integer
          readOnly: true
          description: Assigned but not yet started.
        latest_activity:
          type: string
          format: date-time
          readOnly: true
          description: 'Most recent update across the campaign''s interviews, falling back to

            the campaign''s own creation date when it has none. Interview

            timestamps also move on background writes (summaries, turn state), so

            treat this as approximate activity rather than message recency.

            '
        assignees:
          type: array
          readOnly: true
          description: 'Up to five recipient emails, for the avatar row. Self-assigned

            interviews contribute their creator.

            '
          items:
            type: string
            format: email
        assignee_count:
          type: integer
          readOnly: true
          description: Total distinct recipients, which may exceed `assignees` length.
    MeetingInfo:
      type: object
      description: 'Set on conversations of type `meeting` — the transcript of a call Clara attended

        as a bot (CLA-1843). The conversation is created post-call, so this block is always

        complete when present. Every turn of such a transcript is `role: user` with a

        `speaker` name and a `meeting_offset_ms`; attribute by speaker.

        '
      properties:
        meeting_id:
          type: string
          format: uuid
        platform:
          type: string
          enum:
          - google_meet
          - zoom
          - microsoft_teams
        participants:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              is_host:
                type: boolean
        duration_ms:
          type:
          - integer
          - 'null'
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        url:
          type:
          - string
          - 'null'
          description: Relative in-app path of the meeting page (recording, insights).
    InterviewReferenceDocument:
      type: object
      description: Summary of one reference document on a draft (a `LocalDocument` whose source is `reference`).
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        processing_status:
          type: string
          description: pending → … → completed | failed. The draft cannot be sent or tested until every document is completed or failed.
        source_document:
          type:
          - string
          - 'null'
          format: uuid
          description: The Sources document it was copied from, when picked from the library.
        character_count:
          type: integer
        page_count:
          type:
          - integer
          - 'null'
        size_warning:
          type:
          - string
          - 'null'
          description: Warn-only guidance for a long document (about 150k characters or more); null otherwise.
        created_at:
          type:
          - string
          - 'null'
          format: date-time
    ArtifactSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        semantic_type:
          $ref: '#/components/schemas/ArtifactSemanticType'
        technical_type:
          $ref: '#/components/schemas/ArtifactTechnicalType'
        in_scope:
          type: boolean
        display_order:
          type: integer
        group:
          type: string
          description: 'Catalog group label; empty for predefined artifacts (their section derives

            from `semantic_type`) and for ungrouped custom ones. "Foundation" and

            "Other" are reserved for UI-derived sections and cannot be set; the four

            standard section names ("Project Management", …) are NOT reserved — a

            custom artifact may use one to file itself alongside the predefined

            artifacts.

            '
        definition_short:
          type: string
        head_version_number:
          type:
          - integer
          - 'null'
        head_updated_at:
          type:
          - string
          - 'null'
          format: date-time
        version_count:
          type: integer
        can_delete:
          type: boolean
    LocalDocument:
      type: object
      description: 'A file attached to a conversation, agent settings, agent session, or interview

        draft. `source` says who produced it: `uploaded` (a user, in the conversation),

        `generated` (the agent), or `reference` (the interviewer, before the interview —

        CLA-1887). Signed file URLs are short-lived.

        '
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        name:
          type: string
        file:
          type: string
          description: Signed inline URL of the stored file.
        type:
          type: string
          enum:
          - agent_settings
          - conversation
          - coach_conversation
          - agent_session
          - cross_store_conversation
          - interview_draft
        agent_settings:
          type:
          - string
          - 'null'
          format: uuid
        conversation:
          type:
          - string
          - 'null'
          format: uuid
        coach_conversation:
          type:
          - string
          - 'null'
          format: uuid
        agent_session:
          type:
          - string
          - 'null'
          format: uuid
        cross_store_conversation:
          type:
          - string
          - 'null'
          format: uuid
        interview_draft:
          type:
          - string
          - 'null'
          format: uuid
        source_document:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
          description: The Sources document a reference document was copied from, when applicable.
        claude_file_id:
          type:
          - string
          - 'null'
        source:
          type: string
          enum:
          - uploaded
          - generated
          - reference
          readOnly: true
        document_text:
          type: string
        summary_text:
          type: string
        short_summary_text:
          type: string
        processing_status:
          type: string
          readOnly: true
        page_count:
          type:
          - integer
          - 'null'
          readOnly: true
        character_count:
          type: integer
          readOnly: true
        preview_pdf_url:
          type:
          - string
          - 'null'
          readOnly: true
          description: Signed URL of the PDF that previews the file (itself for PDFs, the parser's rendition for Office files). Only populated on the interview-draft and coach-conversation local-document routes, where a viewer renders it; null everywhere else.
        size_warning:
          type:
          - string
          - 'null'
          readOnly: true
        version_number:
          type:
          - integer
          - 'null'
        total_versions:
          type:
          - integer
          - 'null'
    InterviewTranscriptTranslation:
      type: object
      description: 'Cached machine translation of an interview transcript into one language.

        `translations` maps a message key to the translated text of that transcript

        bubble.


        The key is a 16-hex-character (zero-padded, lower-case) FNV-1a 64 hash over the

        UTF-8 bytes of `role + US + speaker + US + content`, where `US` is the ASCII

        unit separator (code point 31) and `speaker` is the empty string when absent.

        Keys are computed from `chat_history` entries of type `message` with role

        `user` or `assistant`, excluding panel-bound entries (`to: "panel"`) and blank

        content, so identical bubbles share one key and a cache survives an in-progress

        interview growing. Bubbles without an entry are not translated yet.

        '
      properties:
        language:
          type: string
          description: ISO language code of the translation.
        status:
          type: string
          enum:
          - running
          - ready
          - failed
        translations:
          type: object
          additionalProperties:
            type: string
          description: Message key → translated text.
        translated_count:
          type: integer
          description: Current transcript messages that have a translation.
        total_count:
          type: integer
          description: Current transcript messages eligible for translation.
        error:
          type:
          - string
          - 'null'
          description: Stable failure message when `status` is `failed`; retry by calling `translate` again (already translated messages are kept).
        updated_at:
          type: string
          format: date-time
    InterviewDraft:
      allOf:
      - $ref: '#/components/schemas/InterviewDraftInput'
      - type: object
        description: 'A saved, unsent interview-assignment payload. Becomes one interview per

          recipient when sent via the assign endpoint (with `draft_id`), which

          also deletes the draft.

          '
        properties:
          id:
            type: string
            format: uuid
            readOnly: true
          name:
            type: string
            description: 'The draft''s title: generated from the topic at save time unless set by

              hand; empty when the draft has no topic and no custom name (clients show

              "Untitled draft interview").

              '
          name_is_custom:
            type: boolean
            readOnly: true
            description: True once the draft was named by hand; topic changes then keep its name.
          assignee_emails:
            type: array
            readOnly: true
            description: 'Emails of the member recipients in `assignee_ids`, same order; ids that

              are no longer users are left out.

              '
            items:
              type: string
              format: email
          campaign:
            allOf:
            - $ref: '#/components/schemas/InterviewCampaignRef'
            readOnly: true
            description: 'Campaign the interviews created from this draft will belong to; null

              when none. Set via `campaign_id` / `campaign_name`.

              '
          test_runs:
            type: array
            readOnly: true
            description: This draft's test runs, newest first (see `InterviewTestRun`).
            items:
              $ref: '#/components/schemas/InterviewTestRun'
          source_session:
            allOf:
            - $ref: '#/components/schemas/InterviewDraftSourceSession'
            readOnly: true
          reference_documents:
            type: array
            readOnly: true
            description: 'Documents the interviewer attached to frame the interview (CLA-1887),

              oldest first. Managed through `interview-drafts/{id}/local-documents/`.

              '
            items:
              $ref: '#/components/schemas/InterviewReferenceDocument'
          reference_documents_warning:
            type:
            - string
            - 'null'
            readOnly: true
            description: 'Warn-only guidance when the attached set is very long or large (more than 5

              documents, or about 300k characters in total); null otherwise. Never blocks.

              '
          artifact_selection_warning:
            type:
            - string
            - 'null'
            readOnly: true
            description: 'Warn-only guidance when the selected artifacts are large (about 200k

              characters in total); null otherwise. Never blocks.

              '
          created_by:
            type:
            - string
            - 'null'
            format: uuid
            readOnly: true
          created_by_email:
            type:
            - string
            - 'null'
            format: email
            readOnly: true
          created_at:
            type: string
            format: date-time
            readOnly: true
          updated_at:
            type: string
            format: date-time
            readOnly: true
    InterviewListItem:
      type: object
      description: Lightweight interview representation used in list responses (omits the transcript).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type:
          - string
          - 'null'
        created_by:
          type: string
          format: uuid
          readOnly: true
        created_by_email:
          type:
          - string
          - 'null'
          format: email
          readOnly: true
        type:
          type: string
        assigned_to:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
        assigned_by:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
        assigned_to_email:
          type:
          - string
          - 'null'
          format: email
          readOnly: true
        assigned_by_email:
          type:
          - string
          - 'null'
          format: email
          readOnly: true
        is_pending_invite:
          type: boolean
          readOnly: true
        invite_config:
          allOf:
          - $ref: '#/components/schemas/InterviewInviteConfig'
          readOnly: true
        import_info:
          allOf:
          - $ref: '#/components/schemas/ImportedInterviewInfo'
          readOnly: true
        meeting_info:
          allOf:
          - $ref: '#/components/schemas/MeetingInfo'
          readOnly: true
        status:
          type:
          - string
          - 'null'
          readOnly: true
          enum:
          - pending
          - in_progress
          - completed
          description: Null for imported interviews until their transcript parse completes.
        campaign:
          allOf:
          - $ref: '#/components/schemas/InterviewCampaignRef'
          readOnly: true
          description: Campaign this interview belongs to; null for ad hoc interviews.
        first_message_preview:
          type: string
          description: 'Truncated preview of the first user message in the transcript. For imported

            transcripts this is the parse-generated summary when available (the literal

            first turn of a meeting export is usually greeting noise).

            '
        message_count:
          type: integer
          description: Number of conversational messages in the transcript.
        topics_total:
          type: integer
          readOnly: true
          description: 'Number of guided topics on the interview ("3/7 topics" progress on list

            rows). 0 for interviews without guided topics.

            '
        topics_done:
          type: integer
          readOnly: true
          description: Guided topics no longer open (resolved or dismissed).
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    ArtifactSemanticType:
      type: string
      description: 'What the artifact means in the knowledge store. Predefined types are

        seeded by the platform; `custom` artifacts are user-created.

        '
      enum:
      - brief
      - project_plan
      - mental_map
      - general_knowledge
      - playbooks
      - library_description
      - design_templates
      - custom
    GuidedInterviewTopicSkill:
      type: object
      description: One guided-interview topic type, as offered by the new-interview form.
      required:
      - id
      - label
      - description
      - selectable
      properties:
        id:
          type: string
          example: use_case_exploration
        label:
          type: string
          example: Concrete cases
        description:
          type: string
        selectable:
          type: boolean
          description: Whether a human may pick this type for a topic in the form.
    InterviewCampaignRef:
      type: object
      description: Nested campaign reference carried by interviews and drafts.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    InterviewFeedItem:
      type: object
      description: One row of the interviews feed — a campaign or a standalone interview.
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - campaign
          - interview
        campaign:
          $ref: '#/components/schemas/InterviewCampaign'
          description: Present when `kind` is `campaign`.
        interview:
          $ref: '#/components/schemas/InterviewListItem'
          description: Present when `kind` is `interview`.
    ArtifactTechnicalType:
      type: string
      description: 'Storage/editing format of the artifact''s payload — string for

        `markdown` and `bpmn_xml`, object for `mental_map`, array for

        `playbook_list` and `design_template_list`.

        '
      enum:
      - markdown
      - mental_map
      - playbook_list
      - design_template_list
      - bpmn_xml
    InterviewDraftSummary:
      type: object
      description: 'Overview row of a draft (`view=summary` on the list, CLA-1950). Empty values

        are omitted.

        '
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        interview_type:
          type: string
        language:
          type: string
        campaign:
          type: string
          description: Campaign name.
        created_by_email:
          type: string
          format: email
        focus_preview:
          type: string
          description: The draft's `topic`, cut to 200 characters.
        topic_titles:
          type: array
          items:
            type: string
        recipients:
          type: array
          description: Member recipients' emails, then `invite_emails`.
          items:
            type: string
            format: email
        reference_document_count:
          type: integer
        artifact_count:
          type: integer
        test_run_count:
          type: integer
        latest_test_run:
          type: object
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
            draft_changed_since_start:
              type: boolean
        updated_at:
          type: string
          format: date-time
    InterviewDraftInput:
      type: object
      description: 'Writable fields of an interview draft. Everything is optional — drafts are

        deliberately permissive and only sending (assign with `draft_id`) enforces

        the real assignment rules.

        '
      properties:
        name:
          type: string
          description: 'The draft''s title, carried by every interview it sends. Setting it marks

            the name as custom (`name_is_custom`), so topic changes no longer

            regenerate it; an empty string goes back to a title generated from the topic.

            '
        topic:
          type: string
          description: 'The interview focus. When set, a short title is generated from it unless the

            draft has a custom `name`.

            '
        instructions:
          type: string
          maxLength: 4000
          description: 'Guided drafts only: optional rules for HOW Clara runs the session — how

            thorough to be, moves to avoid, item-by-item passes, the shape of the close.

            Read by the interviewer only; never part of the invitation email, the

            notification, or the respondent''s screen (the focus is what respondents see).

            Partial by design: where an instruction conflicts with Clara''s default

            interviewing rules the instruction wins; where it is silent the defaults

            apply. Non-empty on a legacy `interview` draft is rejected (400).

            '
        interview_type:
          type: string
          enum:
          - interview
          - guided-interview
          default: interview
          description: 'Which conversation type the draft fans out to when sent. Set at creation

            (form type cards, or the scoping conversation''s draft tool) and immutable

            afterwards — updates that change it are rejected (400).

            '
        questions:
          type: array
          description: 'Optional specific topics or questions (max 10). Rejected on

            guided-interview drafts — their `topics` structure the conversation.

            '
          items:
            type: string
        topics:
          type: array
          description: 'Guided drafts only (rejected otherwise): the ordered, editable topics the

            interview walks through (max 12). The scoping conversation''s draft tool

            pre-seeds them from the standard guide.

            '
          items:
            $ref: '#/components/schemas/GuidedInterviewTopic'
        assignee_ids:
          type: array
          description: UUIDs of project members to interview. May go stale; re-validated at send.
          items:
            type: string
            format: uuid
        invite_emails:
          type: array
          description: Emails of people not yet on the project. Nobody is contacted until the draft is sent.
          items:
            type: string
            format: email
        language:
          type:
          - string
          - 'null'
          description: 'ISO language code (e.g. `fr`) offered to each recipient as the interview

            language; they can change it for their own interview when they start. Null (the

            default) offers each recipient their own preferred language. Unsupported codes

            are rejected (400).

            '
        custom_message:
          type: string
          description: Optional note replacing the default invitation email copy.
        custom_focus:
          type:
          - string
          - 'null'
          description: 'Overrides the "what it''s about" focus block in invitation emails without

            changing the interview focus. Null (the default) shows the topic truncated

            to a teaser; empty string removes the block; text is shown verbatim.

            '
          maxLength: 500
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/InterviewArtifactSelection'
          description: 'Knowledge-store artifacts whose content the interviewer gets in her prompt,

            each with whether the respondent can also open it. Empty (the default) means

            none — the interviewer then knows only the focus, topics and reference

            documents. Slugs are normalised (trimmed, lowercased, first pick kept); an

            unknown or out-of-scope slug is rejected (400). Resolved at interview time

            against the latest versions, so an artifact removed from scope later simply

            drops out. Replacing the list replaces the visibility too.

            '
        scheduled_send_at:
          type:
          - string
          - 'null'
          format: date-time
        reminders_enabled:
          type: boolean
          default: false
        reminder_start_after_days:
          type: integer
          minimum: 1
          maximum: 30
          default: 2
        reminder_interval_days:
          type: integer
          minimum: 1
          maximum: 30
          default: 3
        reminder_max_count:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
        source_agent_session_id:
          type:
          - string
          - 'null'
          format: uuid
          writeOnly: true
          description: 'Creation only: the CMA Clara session drafting this (passed by the agent via

            the MCP `draft_interviews` tool). Must be one of the caller''s own Clara

            sessions scoped to this project, else 400. Ignored on update. In-process

            Clara records its conversation directly; both read back as `source_session`.

            '
        campaign_id:
          type:
          - string
          - 'null'
          format: uuid
          writeOnly: true
          description: 'Existing campaign (of the same project) to group the draft''s interviews

            under; null removes the draft from its campaign. Wins over

            `campaign_name` when both are sent.

            '
        campaign_name:
          type: string
          writeOnly: true
          description: 'Campaign to group the draft''s interviews under, by name: reuses the

            project''s campaign with that name (case-insensitive) or creates it.

            '
    ValidationError:
      type: object
      additionalProperties:
        type: array
        items:
          type: string
      example:
        email:
        - This field is required.
    Interview:
      type: object
      description: A structured interview conversation, including its full transcript.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type:
          - string
          - 'null'
          description: Interview title (auto-generated from the topic when not provided).
        created_by:
          type: string
          format: uuid
          readOnly: true
          description: UUID of the user who created the interview.
        created_by_email:
          type:
          - string
          - 'null'
          format: email
          readOnly: true
          description: Email of the user who created the interview (the importer, for imported interviews).
        type:
          type: string
          description: 'Conversation type: "interview" (standard mono-topic), "guided-interview"

            (a multi-topic deep-dive whose ordered topics come from the sent draft or

            assign payload; its focus text lives in

            `type_additional_parameters.interview_focus`), or "imported-interview"

            (a read-only transcript of an interview recorded outside the platform,

            created via the import-transcript endpoint).

            '
        type_additional_parameters:
          type: object
          description: Free-form parameters associated with the conversation type.
        chat_history:
          type: array
          description: Ordered list of transcript entries (messages, tool calls, etc.).
          items:
            type: object
        chat_participants:
          type: object
          readOnly: true
          description: 'Users who submitted at least one user turn, keyed by user id (each user entry

            carries a `user_id`). Can differ from `assigned_to` when an admin finishes an

            interview assigned to someone else.

            '
          additionalProperties:
            type: object
            properties:
              email:
                type: string
                format: email
        chat_memory:
          type: object
          description: Assistant memory state accumulated over the conversation.
        local_documents:
          type: array
          readOnly: true
          description: 'Files attached to this interview (ordered by upload time). Only the id, name and

            source are included; resolve a fresh signed download URL via the project-level

            local-documents detail endpoint. Both `uploaded` files and `generated` files

            (produced by an agent in the conversation) can be imported into the Sources

            library.

            '
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              source:
                type: string
                enum:
                - uploaded
                - generated
        assigned_to:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
          description: UUID of the assigned user (null while a pending invite has not yet joined).
        assigned_by:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
          description: UUID of the user who created the assignment.
        assigned_to_email:
          type:
          - string
          - 'null'
          format: email
          readOnly: true
          description: Assignee email, falling back to the invite email for not-yet-joined invitees.
        assigned_by_email:
          type:
          - string
          - 'null'
          format: email
          readOnly: true
        is_pending_invite:
          type: boolean
          readOnly: true
          description: True when assigned to someone who has not yet joined the project.
        invite_config:
          allOf:
          - $ref: '#/components/schemas/InterviewInviteConfig'
          readOnly: true
        interview_focus:
          type:
          - object
          - 'null'
          readOnly: true
          description: 'The seeded interview topic and optional specific questions, for rendering the

            in-chat intro card. Null for non-interviews and interviews without a topic.

            For guided interviews this is read from

            `type_additional_parameters.interview_focus` (they have no focus issue).

            '
          properties:
            topic:
              type: string
            instructions:
              type: string
              description: 'Guided interviews only: the organiser''s rules for how Clara runs the

                session (read from `type_additional_parameters.interview_instructions`).

                Interviewer-only — never included in invitation emails or shown on the

                respondent''s screen. Empty when none were set.

                '
            questions:
              type: array
              items:
                type: string
        topics:
          type: array
          readOnly: true
          description: 'Guided interviews only: the ordered topic agenda seeded at send time,

            with per-topic progress. Empty for every other interview type.

            '
          items:
            type: object
            properties:
              topic_id:
                type: string
                format: uuid
                description: The topic row's id (the value `jump_to_topic_id` takes on a test run).
              title:
                type: string
              description:
                type: string
              status:
                type: string
                enum:
                - open
                - resolved
                - dismissed
                - skipped
                description: '"open" while the topic still has to be covered; "resolved" or

                  "dismissed" once it no longer is. The interview auto-completes

                  when no topic is left open. "skipped" (test runs only): the tester

                  deliberately left the topic out — a choice, not a gap.

                  '
              skill_id:
                type:
                - string
                - 'null'
                description: Standard-guide skill backing the topic; null for custom topics.
        campaign:
          allOf:
          - $ref: '#/components/schemas/InterviewCampaignRef'
          readOnly: true
          description: Campaign this interview belongs to; null for ad hoc interviews.
        campaign_id:
          type:
          - string
          - 'null'
          format: uuid
          writeOnly: true
          description: 'PATCH-only: move the interview to another campaign of the project (or

            null to remove it from its campaign), so past interviews can be

            re-bucketed retroactively.

            '
        campaign_name:
          type: string
          writeOnly: true
          description: 'PATCH-only alternative to `campaign_id`: move the interview to the

            campaign with this name, creating it if the project has none (matched

            case-insensitively). `campaign_id` wins when both are sent.

            '
        is_first_interview:
          type: boolean
          readOnly: true
          description: 'True while the requesting user has never started an assigned interview in this

            project. Drives the intro card''s expanded "how it works" explainer.

            '
        import_info:
          allOf:
          - $ref: '#/components/schemas/ImportedInterviewInfo'
          readOnly: true
        meeting_info:
          allOf:
          - $ref: '#/components/schemas/MeetingInfo'
          readOnly: true
        conversation_summary:
          type: string
          readOnly: true
          description: Background-generated summary of the conversation ("" until generated).
        feedback_state:
          type: string
          readOnly: true
          enum:
          - none
          - submitted
          description: 'Whether the interviewee has rated this interview. Drives whether the

            post-interview feedback prompt is shown. The grade and comment

            themselves are Clarifeye-internal and are never returned.

            '
        test_run:
          allOf:
          - $ref: '#/components/schemas/InterviewTestRun'
          readOnly: true
          description: 'Set when this conversation is a test run of an unsent draft (CLA-1834);

            null for real interviews. Adds `draft_id`, `draft_name`, `draft_edit_url`.

            '
        available_translations:
          type: array
          readOnly: true
          description: 'ISO codes of the languages this transcript has a complete cached machine

            translation in (see the `translate` / `translations` endpoints). The

            translated text itself is never part of the interview payload.

            '
          items:
            type: string
        language:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'ISO language code the assigner set for this interview (null = adapt to the

            respondent). Fixed by the assign / test-run endpoints; the respondent''s own

            choice goes through `respondent_language`.

            '
        respondent_language:
          type:
          - string
          - 'null'
          description: 'ISO language code the respondent picked for this interview — on the type-or-talk

            card before Clara''s first message (CLA-1884), or later from the language selector

            (CLA-1933). Outranks every other language candidate for both the text prompt and

            the voice agent; never written back to the user''s preference. A change applies to

            the next typed reply or the next call (a call in progress keeps its language).

            PATCHable only by the person answering or a project admin (403 otherwise), and

            only until the interview is completed (400 otherwise). Null clears it

            (auto-detect); unsupported codes are rejected (400).

            '
        default_language:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Detail payload only. The ISO code the interview would be conducted in for the

            requesting user if `respondent_language` is left alone — respondent pick, else

            the user''s preferred language, else their org-membership language, else

            `language`; null when nothing resolves (Clara mirrors the respondent).

            '
        live_voice_available:
          type:
          - boolean
          - 'null'
          readOnly: true
          description: 'Detail payload only (CLA-1784). Whether the organization owning THIS knowledge

            store may take interviews as calls: the instance-wide `LIVE_VOICE_ENABLED` +

            ElevenLabs key ANDed with the org''s `allow_live_voice`. Store-scoped, unlike the

            `instance_flags.live_voice_enabled` twin on the user payload, which answers for

            the reader''s *active* org — a respondent who also belongs to an org of their own

            has a different one. Null outside detail payloads; treat null as "not asked",

            never as "off". `POST .../voice-call/` returns 503 when this is false.

            '
        status:
          type:
          - string
          - 'null'
          readOnly: true
          enum:
          - pending
          - in_progress
          - completed
          description: Null for imported interviews until their transcript parse completes.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
      example:
        error: User not found
    InterviewDraftSourceSession:
      type: object
      description: 'The Clara session that created a draft (provenance, SET_NULL on both ends).

        `kind` decides the route a client builds: `clara_fast` = in-process Work with

        Clara conversation (`/agent/clara-fast?conversation_id=`), `cma` = Managed-Agents

        Clara session (`/agent/clara?session_id=`), `coach` = any other coach

        conversation (e.g. scoping), recorded but not linked from the test page.

        '
      properties:
        kind:
          type: string
          enum:
          - clara_fast
          - cma
          - coach
        id:
          type: string
          format: uuid
        name:
          type:
          - string
          - 'null'
  parameters:
    Offset:
      name: offset
      in: query
      description: Number of results to skip for pagination
      schema:
        type: integer
        default: 0
        minimum: 0
    Limit:
      name: limit
      in: query
      description: Maximum number of results per page
      schema:
        type: integer
        default: 100
        minimum: 1
        maximum: 1000
    ProjectId:
      name: project_id
      in: path
      required: true
      description: UUID of the project
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Unauthorized - missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Authentication credentials were not provided.
    NotFound:
      description: Not found - resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Not found.
    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: You do not have permission to perform this action.
    BadRequest:
      description: Bad request - invalid parameters or request body
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/Error'
            - $ref: '#/components/schemas/ValidationError'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'Use `Authorization: Bearer <token>`. The token is either a user token / OAuth access

        token, or a service-account API key (`cfk_...`). A key is valid on every endpoint and

        acts as its service account, an organization member with per-store permissions.

        Refused keys answer 403 with `Invalid API key.`, `API key revoked.`,

        `API key expired.` or `API key disabled.`.

        '
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Use Authorization: Token <token>'
