        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /projects/{project_id}/artifacts/import-catalog/:
    post:
      tags:
      - Artifacts
      summary: Import an artifact catalog
      description: |
        Import a full catalog (same shape as the export) into a project whose
        catalog is still empty — the import is rejected if the project already
        has catalog rows. Only `in_scope_latest` snapshots are supported.
        Requires admin permission.
      operationId: importArtifactCatalog
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactCatalogExport'
      responses:
        '201':
          description: Imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  artifact_count:
                    type: integer
                  version_count:
                    type: integer
                  artifact_snapshot_ids:
                    type: array
                    items:
                      type: string
                      format: uuid
                  artifact_snapshot_id:
                    type: string
                    format: uuid
                    nullable: true
        '400':
          description: Validation error (e.g. project already has a catalog)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /projects/{project_id}/artifacts/{slug}/:
    parameters:
