  /projects/{project_id}/artifacts/:
    get:
      tags:
      - Artifacts
      summary: List artifacts in the catalog
      description: |
        List the project's artifact catalog (paginated). In-scope artifacts sort
        before out-of-scope ones, then by `display_order` and `slug`. Requires
        view permission.
      operationId: listArtifacts
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: scope
        in: query
        required: false
        schema:
          type: string
          enum: [in_scope, out_of_scope, all]
          default: all
        description: Filter by catalog scope membership.
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginatedResponse'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/ArtifactSummary'
        '400':
          description: Invalid scope value
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Artifacts
      summary: Create a custom artifact
      description: |
        Create a custom artifact (`semantic_type` is always `custom`; predefined
        artifacts are seeded by the platform). The slug must be unique within the
        project. An initial empty version is published automatically. Requires
        admin permission.
      operationId: createArtifact
      parameters:
