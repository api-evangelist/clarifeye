      tags:
      - Artifacts
      summary: Read the cohesion guide
      description: |
        Read the default artifact snapshot's cross-artifact cohesion guide.
        `default_cohesion_guide` carries the platform default text so clients
        can preview what `mode=default` resolves to. Requires view permission.
      operationId: getArtifactCohesionGuide
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactCohesionGuide'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Artifact snapshot not found
    patch:
      tags:
      - Artifacts
      summary: Update the cohesion guide
      description: |
        Update the default snapshot's cohesion guide. When `cohesion_guide_mode`
        is `default`, `cohesion_guide_text` is cleared server-side. Requires
        admin permission.
      operationId: updateArtifactCohesionGuide
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cohesion_guide_mode]
              properties:
                cohesion_guide_mode:
                  type: string
                  enum: [default, custom]
                cohesion_guide_text:
                  type: string
                  description: Snapshot-specific guide text; only meaningful with `mode=custom`.
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactCohesionGuide'
        '400':
          description: Invalid mode
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
