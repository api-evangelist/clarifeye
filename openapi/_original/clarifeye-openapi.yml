    patch:
      tags:
      - Imported Object Extractors
      summary: Update imported object extractor (auto-creates new version)
      description: |
        Partial update. Version-bearing field: `extractable_pydantic_class`.

        Pass `set_latest_as_default: true` to promote the new version.
      operationId: updateImportedObjectExtractor
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ExtractorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ImportedObjectExtractor'
              - type: object
                properties:
                  set_latest_as_default:
                    type: boolean
                    writeOnly: true
            examples:
              renameOnly:
                summary: Rename — does NOT create a new version
                value:
                  name: "CRM contacts (renamed)"
              evolveSchema:
                summary: Update Pydantic schema — creates a new version
                value:
                  extractable_pydantic_class: |
                    from pydantic import BaseModel
                    from typing import Optional

                    class ImportedRecord(BaseModel):
                        external_id: str
