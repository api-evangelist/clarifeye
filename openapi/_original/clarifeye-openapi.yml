    ValidationError:
      type: object
      additionalProperties:
        type: array
        items:
          type: string
      example:
        email:
        - This field is required.
    PermissionType:
      type: string
      enum:
      - CAN_PERFORM_ADMIN_ACTIONS
      - CAN_VIEW_DATA
      - CAN_IMPERSONATE_OTHER_USERS
      description: |
        - `CAN_PERFORM_ADMIN_ACTIONS`: Full administrative access
        - `CAN_VIEW_DATA`: Read-only access to project data
        - `CAN_IMPERSONATE_OTHER_USERS`: Impersonate other users in API calls (for a person, contact Clarifeye to enable it; org admins grant it to a service account)
    ProjectProfile:
      type: string
      enum:
      - tech
      - contributor
      - user
      default: contributor
      description: |
        Profile of the user on the project. The profile shapes the UI surface a
        user sees (sidebar, available views) and complements the fine-grained
        `permissions` list.

        - `tech`: Technical profile with access to advanced/technical interfaces
        - `contributor`: Default profile for users who contribute to the project
        - `user`: End-user profile with the most restricted UI surface
    ToolType:
      type: string
      enum:
      - retrieval
      - math
      - document_retrieval
      - data_statistics
      - websearch
      - sub_agent
      description: |
        Category of tool, which controls how it is executed and what
        parameters it accepts. The `retrieval` family additionally exposes a
        `retrieval_mode` field (e.g. `semantic-chunks`, `semantic-objects`,
        `templated-query`).
    Tool:
      type: object
      description: |
        Full configuration of a tool as stored on the project. Use
        [`getToolParameters`](#operation/getToolParameters) to discover the
        request schema for [`runTool`](#operation/runTool); the
        `*_mode` / `*_parameters` fields here describe how the tool is
        scoped at configuration time, not the runtime arguments.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        created_by:
          type: string
          format: uuid
          nullable: true
          description: UUID of the user that created the tool.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        readonly:
          type: boolean
          description: When true, the tool cannot be modified through the API.
        tool_type:
          $ref: '#/components/schemas/ToolType'
        tool_parameters:
          type: object
          description: Tool-type-specific configuration (used by non-retrieval tools or for tool-specific options).
          additionalProperties: true
        document_mode:
          type: string
          description: Scope mode for documents (e.g. `include_all`, `include_subset`).
        document_parameters:
          type: array
          items: {}
          description: Parameters that complement `document_mode` (e.g. a list of document IDs).
        tags_included_mode:
          type: string
          description: Inclusion mode for tags (e.g. `include_all`, `include_subset`, `auto_include`).
        tags_included_parameters:
          type: array
          items: {}
        tags_excluded_mode:
          type: string
          description: Exclusion mode for tags (e.g. `exclude_none`, `exclude_subset`, `auto_exclude`).
        tags_excluded_parameters:
          type: array
          items: {}
        objects_included_mode:
          type: string
        objects_included_parameters:
          type: array
          items: {}
        objects_excluded_mode:
          type: string
        objects_excluded_parameters:
          type: array
          items: {}
        attributes_included_mode:
          type: string
        attributes_included_parameters:
          type: object
          additionalProperties: true
        attributes_excluded_mode:
          type: string
        attributes_excluded_parameters:
          type: object
          additionalProperties: true
        search_scope_extensions:
          type: object
          additionalProperties: true
        retrieval_mode:
          type: string
          description: |
            For tools with `tool_type: retrieval`, the specific retrieval
            variant (e.g. `semantic-chunks`, `semantic-objects`,
            `templated-query`). Ignored for other tool types.
        retrieval_parameters:
          type: object
          description: Configuration of the retrieval algorithm (e.g. `n_objects`, `rerank`, `reformulate_query`).
          additionalProperties: true
        category:
          type: string
          enum:
          - local
          - imported
          description: |
            - `local`: tool is owned by the current project.
            - `imported`: tool is owned by another project and exported into the current one.
        owner_project_id:
          type: string
          format: uuid
        owner_project_name:
          type: string
          nullable: true
        exported_to_count:
          type: integer
          description: Number of other projects this tool has been exported to.
        exported_to:
          type: array
          description: |
            Projects this tool is exported to. Only populated when the tool is
            owned by the current project (`category: local`); empty for
            imported tools.
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
      example:
        id: 4f4a0a36-2c3d-4e6c-9a3b-2b1f0f1a2c11
        name: Search financial chunks
        description: Semantic search over chunks tagged as financial reports.
        created_by: 7e9c0c11-22e0-4d4a-9a3b-9c8e7d6f5a4b
        created_at: '2026-04-12T10:21:33Z'
        updated_at: '2026-05-02T08:44:01Z'
        readonly: false
        tool_type: retrieval
        tool_parameters: {}
        document_mode: include_all
        document_parameters: []
        tags_included_mode: include_all
        tags_included_parameters: []
        tags_excluded_mode: exclude_none
        tags_excluded_parameters: []
        objects_included_mode: include_all
        objects_included_parameters: []
        objects_excluded_mode: exclude_none
        objects_excluded_parameters: []
        attributes_included_mode: include_all
        attributes_included_parameters: {}
        attributes_excluded_mode: exclude_none
        attributes_excluded_parameters: {}
        search_scope_extensions: {}
        retrieval_mode: semantic-chunks
        retrieval_parameters:
          n_objects: 10
          rerank: true
          reformulate_query: false
        category: local
        owner_project_id: 9c2b1c0a-7a1d-4d1d-8e3a-1d2b3c4d5e6f
        owner_project_name: Finance Analytics
        exported_to_count: 0
        exported_to: []
    ToolParameterSpec:
      type: object
      description: |
        Specification for a single parameter accepted by a tool's `run`
        endpoint. Use `id` as the key in the JSON body sent to
        [`runTool`](#operation/runTool).
      properties:
        id:
          type: string
          description: Parameter name (used as the JSON key when calling `runTool`).
        type:
          type: string
          enum:
          - string
          - integer
          - number
          - boolean
          - array
          - object
          description: JSON type of the parameter value.
        description:
          type: string
          description: Human-readable description of the parameter.
        required:
          type: boolean
          description: Whether the parameter must be supplied when running the tool.
        default:
          description: Default value when the parameter is omitted. Type matches `type`.
      example:
        id: query
        type: string
        description: The search query for the tool.
        required: false
        default: ''
    ToolRunRequest:
      type: object
      description: |
        Request body for running a tool. Parameters vary by tool type.
        Most tools accept a `query` parameter and optional `top_k` for result count.
      properties:
        query:
          type: string
          description: The search query or input for the tool
          example: What are the key findings about revenue growth?
        top_k:
          type: integer
          description: Maximum number of results to return
          default: 10
          example: 10
      additionalProperties: true
    ToolRunResponse:
      type: array
      description: Array of tool execution results
      items:
        type: object
        description: Individual result object (structure varies by tool type)
        additionalProperties: true
    ToolError:
      type: object
      description: Error response from tool execution
      properties:
        error_type:
          type: string
          description: Category of the error
          example: syntax_error
        error_code:
          type: string
          description: Specific error code
          example: INVALID_QUERY
        status:
          type: string
          description: Error status
          example: error
        message:
          type: string
          description: Human-readable error message
          example: Invalid query syntax
    ExtractorTableRetrievalLineageEntry:
      type: object
      description: |
        A single step in the upstream lineage path of a `HydrationComputation`.
        Each entry identifies an upstream extraction-flow node and the exact
        `computation_hash` produced by that node.
      properties:
        node_id:
          type: string
          format: uuid
          description: UUID of the upstream extraction-flow node.
        computation_hash:
          type: string
          description: Computation hash produced by `node_id`.
      required:
      - node_id
      - computation_hash
    ExtractorTableRetrievalRequest:
      type: object
      required:
      - extractor_version_id
      properties:
        extractor_version_id:
          type: string
          format: uuid
          description: |
            UUID of the `ExtractorVersion` whose output rows should be
            returned. Rows are joined with `HydrationComputation` records on
            their `computation_hash`.
        filters:
          type: object
          description: |
            Column-level filters. Keys are column names with optional
            Django-style lookups (e.g. `document_id`, `min_page__gte`,
            `max_page__lte`, `deleted__isnull`). The reserved key
            `processing_options` (used by the frontend for display only) is
            stripped server-side.
          additionalProperties: true
          example:
            document_id: 82c71787-37e9-42ca-a995-982e2ed53169
            min_page__gte: 1
            max_page__lte: 1
        columns:
          type: array
          description: |
            Column names to return in each row. Omit (or send `[]`) to return
            every column of the underlying physical table.
          items:
            type: string
          example:
          - id
          - json_object
          - object_bbox
          - document_id
          - min_page
          - max_page
        lineage:
          type: array
          nullable: true
          description: |
            Optional list of `{node_id, computation_hash}` entries restricting
            the result set to a specific upstream computation path. Send `null`
            or omit to retrieve all rows for the extractor version.
          items:
            $ref: '#/components/schemas/ExtractorTableRetrievalLineageEntry'
        include_deleted_rows:
          type: boolean
          default: false
          description: |
            When `true`, also return rows whose `HydrationComputation` has
            been soft-deleted (`deleted_at IS NOT NULL`) and rows where the
            table's `deleted` flag is set. Defaults to `false`.
        limit:
          type: integer
          default: 100
          description: Maximum number of rows to return.
        offset:
          type: integer
          default: 0
          description: Number of rows to skip for pagination.
    ExtractorTableRetrievalResponse:
      type: object
      description: |
        Wrapper around the paginated list of rows produced by the requested
        `ExtractorVersion`.
      properties:
        result:
          type: object
          properties:
            results:
              type: array
              description: The rows matching the request.
              items:
                type: object
                additionalProperties: true
            total:
              type: integer
              description: Total number of matching rows (ignoring `limit` / `offset`).
            limit:
              type: integer
              description: Echo of the `limit` used to compute this page.
            offset:
              type: integer
              description: Echo of the `offset` used to compute this page.
            has_next:
              type: boolean
              description: True when `offset + limit < total`.
            has_previous:
              type: boolean
              description: True when `offset > 0`.
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
