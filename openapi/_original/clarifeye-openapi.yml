          enum:
            - pending
            - in_progress
        type:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        self_started:
          type: boolean
          description: |
            True when the conversation has no assignee at all (self-run interviews and
            the onboarding interview) — the Home UI labels these "Started by you".

    KnowledgeChangelogEntry:
      type: object
      description: |
        An append-only record of a change to a project's knowledge (mental map,
        playbook, brief, API ontology change, or document upload/sync). Read-only:
        entries originate from internal events, never from API clients.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        description:
          type: string
          readOnly: true
          description: Human-readable summary (embeds the source and, where known, the user's email).
        details:
          type: object
          readOnly: true
          additionalProperties: true
          description: Structured event payload (e.g. document-upload counts). May be empty.
        user_email:
          type: string
          format: email
          nullable: true
          readOnly: true
          description: Email of the user who made the change; null for automated events or deleted users.
        artifact_version_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: |
            The artifact version this entry records, when the change was an artifact
            edit; null for non-artifact events or when the version was deleted.

