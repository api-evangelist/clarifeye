          nullable: true
        alerts_additional_instructions:
          type: string
          nullable: true
        alerts_llm_model:
          type: string
          nullable: true
        import_mode:
          type: boolean
          writeOnly: true
          default: false
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        prompt_generation_status:
          type: string
          nullable: true
          readOnly: true
        deployed_tagging_tree:
          type: object
          nullable: true
          readOnly: true
        deployed_extraction_prompt:
          type: string
          nullable: true
          readOnly: true
        deployed_llm_model:
          type: string
          nullable: true
          readOnly: true
        extracted_tags_table:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        alerts_tags_table:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        chunks_table_version_info:
          type: object
          nullable: true
          readOnly: true
        filtering_options:
          type: array
          readOnly: true
          items:
            type: object
        table_version_updates:
          type: object
          nullable: true
          readOnly: true
        versions:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/TagExtractorVersion'
        default_version:
