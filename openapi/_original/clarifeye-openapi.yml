    PipelineRunStatus:
      type: string
      description: |
        Lifecycle status of a pipeline run or step:
        - `pending` — queued, not yet started
        - `running` — currently executing
        - `completed` — finished successfully
        - `completed_with_warnings` — finished, but some steps emitted warnings
        - `failed` — terminated with an error
        - `aborted` — cancelled via the `abort` action
      enum:
      - pending
      - running
      - completed
      - completed_with_warnings
      - failed
      - aborted
    PipelineRunStep:
      type: object
      description: One step within a pipeline run's DAG.
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        step:
          type: string
          description: The pipeline step type (parsing, chunking, tag-extraction, etc.).
        name:
          type: string
          nullable: true
          description: Human-readable name of the step within the DAG.
        status:
          $ref: '#/components/schemas/PipelineRunStatus'
        inputs:
          type: object
          description: Map of input table name → resolved table version UUID.
          additionalProperties:
            type: string
            format: uuid
            nullable: true
        outputs:
          type: object
          description: Map of output table name → resolved table version UUID.
          additionalProperties:
            type: string
            format: uuid
            nullable: true
        warnings:
          nullable: true
          description: Warnings emitted by the step, when any.
        depends_on:
          type: array
          items:
            type: string
          description: Names of the steps this step depends on.
        params:
          type: object
          description: Step-specific parameters used at execution time.
        tag_extractor_id:
          type: string
          format: uuid
          nullable: true
        object_extractor_id:
          type: string
          format: uuid
          nullable: true
        chunks_extractor_id:
          type: string
          format: uuid
          nullable: true
    PipelineRunListItem:
      type: object
      description: |
        Lightweight pipeline run representation returned by the list endpoint.
        Excludes the large `chunk_ids` / `document_ids` arrays and truncates
        `raw_logs` to the most recent entries. Use the detail endpoint to get
        the full payload.
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/PipelineRunStatus'
        project:
          type: string
          format: uuid
        pipeline_name:
          type: string
        mode:
          type: string
          description: Run mode (e.g. `recreate-all`, `recreate-single`, `upsert-single`, `upsert-all`).
        celery_task_id:
          type: string
        user:
          type: string
          format: uuid
          nullable: true
          description: ID of the user who triggered the run.
        tables:
          type: object
          nullable: true
          description: Map of table name → table version UUID for the run.
        steps:
          type: array
          items:
            $ref: '#/components/schemas/PipelineRunStep'
        document_count:
          type: integer
          description: Number of documents this run targets.
        chunk_count:
          type: integer
          description: Number of chunks this run targets.
        raw_logs:
          type: string
          description: Truncated tail of run logs (most recent entries only).
    PipelineRun:
      type: object
