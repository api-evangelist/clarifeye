          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunksExtractor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /projects/{project_id}/chunks-extractors/{extractor_id}/:
    get:
      tags:
      - Chunks Extractors
      summary: Retrieve chunks extractor
      operationId: getChunksExtractor
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ExtractorId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunksExtractor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Chunks Extractors
      summary: Update chunks extractor (auto-creates new version)
      description: |
        Partial update. Version-bearing fields: `maximum_chunk_size`,
        `minimum_chunk_size`, `page_as_separator`,
        `title_section_separator_mode`, `excluded_block_types`,
