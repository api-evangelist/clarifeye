            $ref: '#/components/schemas/PermissionType'
        profile:
          $ref: '#/components/schemas/ProjectProfile'
    InvitationStatus:
      type: string
      enum:
      - pending
      - accepted
      - cancelled
      description: |
        - `pending`: Invitation sent, awaiting response
        - `accepted`: User accepted the invitation
        - `cancelled`: Invitation was cancelled
    ProjectInvite:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionType'
        profile:
          $ref: '#/components/schemas/ProjectProfile'
        status:
          $ref: '#/components/schemas/InvitationStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        invited_by:
          $ref: '#/components/schemas/User'
        assigned_interview_count:
          type: integer
          description: |
            Interviews still waiting on this invitation. Non-zero means the
            invitation exists to deliver an interview, so removing
            CAN_TAKE_INTERVIEW would leave the invitee notified but unable to
            open it.
    BulkInviteResult:
      type: object
      properties:
        email:
          type: string
          description: Normalized (lowercased) email address from the request
        status:
          type: string
          enum:
          - invited_new
          - added_existing
          - skipped
          description: |
            - `invited_new`: pending invite created, signup email sent
            - `added_existing`: existing user added immediately
            - `skipped`: nothing done, see `reason`
        reason:
          type: string
          nullable: true
          enum:
          - invalid_email
          - already_member
          - pending_invite
          - domain_not_allowed
          - error
          description: |
            Why the email was skipped; null unless status is `skipped`.
            `error` means an unexpected failure was contained to this address so
            the rest of the batch could proceed.
    BulkInviteResponse:
      type: object
      properties:
        results:
          type: array
          description: Per-email outcomes, in request order after deduplication
          items:
            $ref: '#/components/schemas/BulkInviteResult'
        invited_new:
          type: integer
        added_existing:
          type: integer
        skipped:
          type: integer
    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Document filename
        file:
          type: string
          format: uri
          description: URL to the document file
        content_type:
          type: string
          description: MIME type of the document
          example: application/pdf
        computed_pdf_file:
          type: string
          format: uri
          nullable: true
          description: URL to generated PDF version (if applicable)
        source:
          type: string
          enum:
          - upload
          - connector
          description: Origin of the document
        source_metadata:
          type: object
          description: Metadata about the document source
        page_count:
          type: integer
          nullable: true
          description: Number of pages in the document
        file_size:
          type: integer
          nullable: true
          description: File size in bytes
        metadata:
          type: array
          description: |
            List of key-value metadata pairs. Each element is a two-element array `[key, value]`.
          items:
            type: array
            items:
              type: string
            minItems: 2
            maxItems: 2
          example:
          - - category
            - Finance
          - - region
            - EMEA
        collection:
          allOf:
          - $ref: '#/components/schemas/DocumentCollectionSummary'
          nullable: true
          readOnly: true
          description: |
            The collection this document belongs to (the membership foreign key); `null`
            means the "Default" (uncategorised) bucket. A mirrored `["tag", slug]` pair is
            also kept on `metadata`. Move a document with the `set-collection` action.
        status:
          type: string
          enum:
          - active
          - deleting
          - deleted
          description: Document deletion status
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When the document was added to the project.
        created_by:
          type: object
          nullable: true
          readOnly: true
          description: |
            The user who uploaded the document. Only returned to callers with admin permission
            on the project; `null` for non-admin callers. Also `null` for connector-imported
            documents (which are attributed to the connector, not a person) and for documents
            created before this was tracked.
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email
    DocumentMinimal:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Document filename
        content_type:
          type: string
          description: MIME type of the document
        page_count:
          type: integer
          nullable: true
          description: Number of pages in the document
        file_size:
          type: integer
          nullable: true
          description: File size in bytes
        metadata:
          type: array
          description: |
            List of key-value metadata pairs. Each element is a two-element array `[key, value]`.
          items:
            type: array
            items:
              type: string
            minItems: 2
            maxItems: 2
        collection:
          allOf:
          - $ref: '#/components/schemas/DocumentCollectionSummary'
          nullable: true
          readOnly: true
          description: The collection this document belongs to; `null` means "Default".
        status:
          type: string
          enum:
          - active
          - deleting
          - deleted
          description: Document deletion status
    DocumentCollectionSummary:
      type: object
      description: Compact collection reference embedded on a document.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
    DocumentCollection:
      type: object
      description: |
        A named grouping of documents within a project. Membership is the
        `Document.collection` foreign key (single collection per document); a mirrored
        `["tag", slug]` pair is also kept on each document's `metadata` so the
        retrieval/extraction layers can scope to a collection.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Human-readable label (editable).
        slug:
          type: string
          readOnly: true
          description: |
            Stable identifier documents are linked by. Derived from `name` at creation
            and immutable afterwards (renaming changes only `name`).
        document_count:
          type: integer
          readOnly: true
          description: Number of active documents in this collection (server-annotated).
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - name

