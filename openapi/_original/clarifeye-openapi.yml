          type: string
          format: uuid
          description: Soft reference to the matching entry's id in the project's design_templates.
        name:
          type: string
        content_type:
          type: string
          nullable: true
          readOnly: true
        signed_url:
          type: string
          format: uri
          nullable: true
          readOnly: true
          description: Signed storage (GCS/S3) URL for browser/UI download and for the generation agent to fetch.
        created_at:
          type: string
          format: date-time
          readOnly: true
    ArtifactSemanticType:
      type: string
      description: |
        What the artifact means in the knowledge store. Predefined types are
        seeded by the platform; `custom` artifacts are user-created.
      enum:
      - brief
      - project_plan
      - mental_map
      - general_knowledge
      - playbooks
      - library_description
      - design_templates
      - custom
    ArtifactTechnicalType:
      type: string
      description: |
        Storage/editing format of the artifact's payload — string for
        `markdown` and `bpmn_xml`, object for `mental_map`, array for
        `playbook_list` and `design_template_list`.
      enum:
      - markdown
      - mental_map
      - playbook_list
      - design_template_list
      - bpmn_xml
    ArtifactSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        semantic_type:
          $ref: '#/components/schemas/ArtifactSemanticType'
        technical_type:
          $ref: '#/components/schemas/ArtifactTechnicalType'
        in_scope:
          type: boolean
        display_order:
          type: integer
        group:
          type: string
          description: |
            Catalog group label; empty for predefined artifacts (their section derives
            from `semantic_type`) and for ungrouped custom ones. "Foundation" and
            "Other" are reserved for UI-derived sections and cannot be set; the four
            standard section names ("Project Management", …) are NOT reserved — a
            custom artifact may use one to file itself alongside the predefined
            artifacts.
        definition_short:
          type: string
        head_version_number:
          type: integer
          nullable: true
        head_updated_at:
          type: string
          format: date-time
          nullable: true
        version_count:
          type: integer
        can_delete:
          type: boolean
    ArtifactDetail:
      allOf:
      - $ref: '#/components/schemas/ArtifactSummary'
      - type: object
        properties:
          definition_long:
            type: string
          format_description:
            type: string
            description: Custom artifacts only; empty string for predefined types.
          capture_discipline:
            type: string
            description: Custom artifacts only; empty string for predefined types.
          selected_version_number:
            type: integer
            nullable: true
          payload:
            description: |
              Content of the selected version; shape depends on
              `technical_type`. Null when the artifact has no versions.
    ArtifactVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        version_number:
          type: integer
        short_name:
          type: string
        change_summary:
          type: string
        edit_source:
          type: string
          description: 'Where the edit came from: "chat", "clara", "mcp", "ui"; empty for legacy/system writes.'
        coach_conversation_id:
          type: string
          format: uuid
          nullable: true
          description: Coach conversation whose agent produced this version, when known.
        created_at:
          type: string
          format: date-time
        created_by_id:
          type: string
          format: uuid
          nullable: true
        created_by_email:
          type: string
          format: email
          nullable: true
        conversation:
          type: object
          nullable: true
          description: Coach conversation that produced this version, when known.
          properties:
            id:
              type: string
              format: uuid
            type:
              type: string
              nullable: true
              description: Conversation type (e.g. "interview", "onboarding", "work_with_clara").
            name:
              type: string
              nullable: true
        payload:
          description: Version content; shape depends on the artifact's `technical_type`. Null allowed.
    ArtifactVersionHistoryEntry:
      type: object
      description: Lean history row — attribution and linked context, no payload.
      properties:
        id:
          type: string
          format: uuid
        version_number:
          type: integer
        short_name:
          type: string
        change_summary:
          type: string
        edit_source:
          type: string
          description: 'Where the edit came from: "chat", "clara", "mcp", "ui"; empty for legacy/system writes.'
        created_at:
          type: string
          format: date-time
        created_by_email:
          type: string
          format: email
          nullable: true
        conversation:
          type: object
          nullable: true
          description: Coach conversation that produced this version, when known.
          properties:
            id:
              type: string
              format: uuid
            type:
              type: string
              nullable: true
              description: Conversation type (e.g. "interview", "onboarding", "work_with_clara").
            name:
              type: string
              nullable: true
        changelog_entry:
          type: object
          nullable: true
          description: Linked knowledge-changelog entry, when one was written for this version.
          properties:
            id:
              type: string
              format: uuid
            description:
              type: string
            created_at:
              type: string
              format: date-time
            user_email:
              type: string
              format: email
              nullable: true
    ArtifactCreateRequest:
      type: object
      description: |
        The slug is always generated server-side by slugifying the title; the created
        artifact's slug is returned in the response. A title whose slug is already taken
        in the project is rejected with 400 keyed to `title` — pick a different title.
      required:
      - technical_type
      - title
      - definition_short
      - capture_discipline
      properties:
        technical_type:
          $ref: '#/components/schemas/ArtifactTechnicalType'
        title:
          type: string
          maxLength: 255
        group:
          type: string
          maxLength: 64
          description: |
            Optional group label; "Foundation" and "Other" are reserved. The standard
            section names ("Project Management", …) are allowed and file the artifact
            alongside the predefined ones.
        definition_short:
          type: string
          description: Purpose of the artifact.
        format_description:
          type: string
          description: How the content should be structured.
        capture_discipline:
          type: string
          description: Knowledge capture rules for the artifact.
    ArtifactUpdateRequest:
      type: object
      description: |
        PATCH semantics — only fields present in the request are updated.
        Applies to custom artifacts only.
      properties:
        title:
          type: string
          maxLength: 255
        group:
          type: string
          maxLength: 64
        definition_short:
          type: string
        format_description:
          type: string
        capture_discipline:
          type: string
    ArtifactCohesionGuide:
      type: object
      properties:
        cohesion_guide_mode:
          type: string
          enum: [default, custom]
        cohesion_guide_text:
          type: string
          description: Snapshot-specific text; empty when mode is `default`.
        default_cohesion_guide:
          type: string
          readOnly: true
          description: The platform default guide text that `mode=default` resolves to.
    ArtifactCatalogExport:
      type: object
      required:
      - artifacts
      properties:
        artifact_snapshots:
          type: array
          items:
            type: object
            properties:
              snapshot_type:
                type: string
                enum: [in_scope_latest]
              cohesion_guide_mode:
                type: string
                enum: [default, custom]
              cohesion_guide_text:
                type: string
              created_at:
                type: string
                format: date-time
                nullable: true
              updated_at:
                type: string
                format: date-time
                nullable: true
        artifacts:
          type: array
          items:
            type: object
            required:
            - slug
            - semantic_type
            - technical_type
            - versions
            properties:
              slug:
                type: string
              title:
                type: string
              semantic_type:
                $ref: '#/components/schemas/ArtifactSemanticType'
              technical_type:
                $ref: '#/components/schemas/ArtifactTechnicalType'
              display_order:
                type: integer
              group:
                type: string
              out_scoped_at:
                type: string
                format: date-time
                nullable: true
              definition_short:
                type: string
              definition_long:
                type: string
              versions:
                type: array
                items:
                  type: object
                  required:
                  - version_number
                  properties:
                    version_number:
                      type: integer
                      minimum: 1
                    short_name:
                      type: string
                    change_summary:
                      type: string
                    payload:
                      description: Version content; shape depends on the artifact's `technical_type`. Null allowed.
                    created_at:
                      type: string
                      format: date-time
                      nullable: true
  responses:
    BadRequest:
      description: Bad request - invalid parameters or request body
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/Error'
            - $ref: '#/components/schemas/ValidationError'
    Unauthorized:
      description: Unauthorized - missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Authentication credentials were not provided.
    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: You do not have permission to perform this action.
    NotFound:
      description: Not found - resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Not found.
