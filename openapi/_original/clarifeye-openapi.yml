    - $ref: '#/components/parameters/ArtifactSlug'
    get:
      tags:
      - Artifacts
      summary: Retrieve an artifact
      description: |
        Retrieve one artifact with its definitions and the payload of the
        selected version (head by default; pass `version` to read an older
        one). Requires view permission.
      operationId: getArtifact
      parameters:
      - name: version
        in: query
        required: false
        schema:
          type: integer
        description: Version number to read instead of the head version.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactDetail'
        '400':
          description: Non-integer version
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Artifacts
      summary: Update a custom artifact
      description: |
        Update a custom artifact's metadata (title, group, definitions).
        Only fields present in the request are touched. Predefined artifacts
        cannot be edited. Requires admin permission.
      operationId: updateArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactDetail'
        '400':
          description: Validation error (e.g. not a custom artifact, reserved group name)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Artifacts
      summary: Delete an artifact
      description: |
        Delete an artifact and its versions. Rejected when the artifact's
        delete preconditions are not met (see `can_delete` on the summary).
        Requires admin permission.
      operationId: deleteArtifact
      responses:
        '204':
          description: Deleted
        '400':
          description: Artifact cannot be deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/artifacts/{slug}/remove-from-scope/:
    post:
      tags:
      - Artifacts
      summary: Remove an artifact from scope
      description: |
        Take the artifact out of the knowledge-store scope (it stays in the
        catalog and keeps its history). The brief artifact cannot be removed
        from scope. Requires admin permission.
      operationId: removeArtifactFromScope
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ArtifactSlug'
      responses:
        '200':
          description: Updated artifact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactDetail'
        '400':
          description: Artifact cannot be removed from scope (brief)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/artifacts/{slug}/restore-to-scope/:
    post:
      tags:
      - Artifacts
      summary: Restore an artifact to scope
      description: Put an out-of-scope artifact back in scope. Requires admin permission.
      operationId: restoreArtifactToScope
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ArtifactSlug'
      responses:
        '200':
          description: Updated artifact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/artifacts/{slug}/versions/:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    - $ref: '#/components/parameters/ArtifactSlug'
    get:
      tags:
      - Artifacts
      summary: List artifact versions
      description: |
        List all versions of an artifact, newest first, payloads included.
        Not paginated. Requires view permission.
      operationId: listArtifactVersions
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArtifactVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Artifacts
      summary: Publish a new artifact version
      description: |
        Publish a new head version with the given payload. The payload shape
        depends on the artifact's `technical_type` — string for `markdown` /
        `bpmn_xml`, object for `mental_map`, array for `playbook_list` /
        `design_template_list`. A null payload clears the artifact.
        Emits the same side effects as agent edits (knowledge-changelog entry
        with `edit_source: "ui"`, analytics). Requires admin permission.
      operationId: createArtifactVersion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                payload:
                  description: Version content; shape depends on the artifact's `technical_type`. Null clears the artifact.
                change_summary:
                  type: string
                short_name:
                  type: string
                  maxLength: 128
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactVersion'
        '400':
          description: Invalid payload
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/artifacts/{slug}/versions/history/:
    get:
      tags:
      - Artifacts
      summary: Artifact version history
      description: |
        Paginated version history for an artifact, newest first. Rows are lean —
        no payloads — and carry provenance context: who made the change, its
        `edit_source`, the linked knowledge-changelog entry, and the coach
        conversation that produced it (when one exists). Requires admin permission.
      operationId: getArtifactVersionHistory
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ArtifactSlug'
      - name: limit
        in: query
        description: Page size (default 20, maximum 100).
        schema:
          type: integer
          default: 20
          maximum: 100
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginatedResponse'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/ArtifactVersionHistoryEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/artifacts/{slug}/versions/{version_number}/:
    get:
      tags:
      - Artifacts
      summary: Retrieve an artifact version
      description: Retrieve one version of an artifact by number. Requires view permission.
      operationId: getArtifactVersion
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ArtifactSlug'
      - name: version_number
        in: path
        required: true
        schema:
          type: integer
        description: Version number (1-based, unique per artifact)
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactVersion'
        '400':
          description: Non-integer version number
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/artifacts/{slug}/versions/{version_number}/restore/:
    post:
      tags:
      - Artifacts
      summary: Restore an artifact version
      description: |
        Publish a new head version copying the payload of an older version
        (nothing is deleted; history stays intact). The restore itself goes
        through the normal publish path, so it appears in the knowledge
        changelog and the version history with `edit_source: "ui"`.
        Rejected (400) for out-of-scope artifacts. Requires admin permission.
      operationId: restoreArtifactVersion
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ArtifactSlug'
      - name: version_number
        in: path
        required: true
        schema:
          type: integer
        description: Version number to restore (1-based, unique per artifact)
      responses:
        '201':
          description: The newly published head version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactVersion'
        '400':
          description: Out-of-scope artifact or non-integer version number
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/design-template-files/:
    get:
      tags:
      - Design System Templates
      summary: List design template files
      description: |
        List the project's design template reference files (paginated). Optionally
        filter to a single template via `template_id`. Requires project view permission.
      operationId: listDesignTemplateFiles
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - name: template_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Filter results to files attached to this design template.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginatedResponse'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/DesignTemplateFile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Design System Templates
      summary: Upload a design template file
      description: |
        Upload a reference/example file and attach it to a design template. A file
        whose name matches an existing reference file on the template replaces it.
        Requires project-admin permission.
      operationId: uploadDesignTemplateFile
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - template_id
              - file
              properties:
                template_id:
                  type: string
                  format: uuid
                  description: The design template to attach this file to.
                file:
                  type: string
                  format: binary
                  description: The file to upload.
      responses:
        '201':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignTemplateFile'
        '400':
          description: Bad request - no file uploaded or invalid file format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /projects/{project_id}/design-template-files/{file_id}/:
    delete:
      tags:
      - Design System Templates
      summary: Delete a design template file
      description: |
        Delete a design template reference file from the project, removing it from
        storage. Requires project-admin permission.
      operationId: deleteDesignTemplateFile
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: file_id
        in: path
        required: true
        description: UUID of the design template file
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: File deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/me/meeting-calendars/:
    get:
      tags:
      - Meetings
      summary: My calendar connections
      description: |
        The requesting user's connected calendars (Google Calendar, Microsoft Outlook) for
        Clara's meeting scheduling, and which providers this instance can connect. The
        refresh token is never stored here — Recall.ai holds it; reconnecting means a fresh
        consent.
      operationId: listMeetingCalendarConnections
      responses:
        '200':
          description: Connections
          content:
            application/json:
              schema:
                type: object
                properties:
                  platforms_available:
                    type: array
                    items:
                      type: string
                      enum: [google_calendar, microsoft_outlook]
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/MeetingCalendarConnection'
  /users/me/meeting-calendars/connect/:
    post:
      tags:
      - Meetings
      summary: Start connecting a calendar
      description: |
        Returns the provider's authorize URL for the frontend popup. The provider redirects
        to `/api/v1/meetings/oauth/callback/`, which registers the calendar with Recall.ai and
        bounces the popup to the frontend relay page with `calendar_connected=1` or
        `calendar_error=<code>`.
      operationId: connectMeetingCalendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, redirect_back_to]
              properties:
                platform:
                  type: string
                  enum: [google_calendar, microsoft_outlook]
                redirect_back_to:
                  type: string
                  format: uri
                  description: Frontend page to return to (must be on an allowed host).
      responses:
        '200':
          description: Authorize URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorize_url:
                    type: string
                    format: uri
        '400':
          description: Provider not configured on this instance, or unsafe redirect target
  /users/me/meeting-calendars/{id}/:
    delete:
      tags:
      - Meetings
      summary: Disconnect a calendar
      description: Deletes the calendar on Recall.ai (its bots are unscheduled) and cancels this user's still-scheduled calendar meetings.
      operationId: disconnectMeetingCalendar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Disconnected
  /users/me/mcp-connections/:
    get:
      tags:
      - External MCP
      summary: List my external MCP connections
      description: >-
        The current user's OAuth connections to external MCP servers, one per distinct
        server URL, grouped across all knowledge stores the user belongs to. Never
        returns tokens or client secrets.
      operationId: listUserMcpConnections
      responses:
        '200':
          description: Connections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserMCPConnection'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/mcp-connections/initiate/:
    post:
      tags:
      - External MCP
      summary: Begin an external MCP OAuth connection
      description: >-
        Starts the OAuth authorization-code flow for an enabled OAuth MCP server the
        user can access. Returns the authorization URL for the frontend to open in a
        popup. Rate limited.
      operationId: initiateUserMcpConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              - redirect_back_to
              properties:
                url:
                  type: string
                  description: MCP server URL (must match an enabled OAuth server in one of the user's stores).
                redirect_back_to:
                  type: string
                  description: Same-origin frontend URL to return to after the dance (validated against the redirect allowlist).
      responses:
        '200':
          description: Authorization URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorize_url:
                    type: string
        '400':
          description: Unsafe redirect, unknown server, or discovery/registration failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/mcp-connections/{id}/reconnect/:
    post:
      tags:
      - External MCP
      summary: Re-authorize an existing MCP connection
      operationId: reconnectUserMcpConnection
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - redirect_back_to
              properties:
                redirect_back_to:
                  type: string
      responses:
        '200':
          description: Authorization URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorize_url:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/me/mcp-connections/set-api-key/:
    post:
      tags:
      - External MCP
      summary: Set the current user's API key for an api_key MCP server
      description: >-
        Stores the user's own API key for an enabled api_key server in one of their
        knowledge stores (encrypted at rest) and pushes it to their vault. Credentials
        are per-user; there is no shared store-level key.
      operationId: setUserMcpApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              - api_key
              properties:
                url:
                  type: string
                api_key:
                  type: string
                  writeOnly: true
      responses:
        '200':
          description: The updated connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMCPConnection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/mcp-connections/{id}/revoke/:
    post:
      tags:
      - External MCP
      summary: Revoke an external MCP connection
      description: Best-effort remote token revocation, removes the Anthropic vault credential, and marks the connection revoked.
      operationId: revokeUserMcpConnection
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Revoked connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMCPConnection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  # ============================================
  # CONNECTORS (external storage sync)
  # ============================================
  /projects/{project_id}/connections/{connection_id}/import-preview/:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: connection_id
        in: path
        required: true
        description: UUID of the connection
        schema:
          type: string
          format: uuid
    post:
      operationId: previewConnectionImport
      tags:
        - Connectors
      summary: Start a dry-run count of what an import would do
      description: |
        Starts a background task that enumerates provider metadata (no downloads) for the
        given folder/file selection and diffs it against already-imported documents. Poll
        `import-preview-status` with the returned `task_id` for progress and the result.
        An empty selection falls back to the connection's stored selection. Enumeration is
        budgeted (file, request, and wall-clock caps): when `truncated` is true,
        `to_create`/`to_update` are partial lower bounds and `to_delete` is null (a partial
        enumeration cannot prove a file was removed).
        Counts respect the connection's file-type rules and the platform supported-type
        baseline (blocked files stay in `total_remote` but not `to_create`), and
        archived documents are excluded from every count (the sync leaves them alone).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                folders:
                  type: array
                  items:
                    $ref: '#/components/schemas/ConnectionSelectionItem'
                files:
                  type: array
                  items:
                    $ref: '#/components/schemas/ConnectionSelectionItem'
      responses:
        '202':
          description: Count started
          content:
            application/json:
              schema:
                type: object
                required: [task_id]
                properties:
                  task_id:
                    type: string
                    description: Pass to import-preview-status
        '403':
          description: Site not allowed by the organization's allowlist, or not a project member
        '501':
          description: The connection's provider does not support import preview (only SharePoint does)
  /projects/{project_id}/connections/{connection_id}/import-preview-status/:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: connection_id
        in: path
        required: true
        description: UUID of the connection
        schema:
          type: string
          format: uuid
    get:
      operationId: getConnectionImportPreviewStatus
      tags:
        - Connectors
      summary: Poll a dry-run import count
      parameters:
        - name: task_id
          in: query
          required: true
          description: The `task_id` returned by import-preview
          schema:
            type: string
      responses:
        '200':
          description: Current state of the count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportPreviewStatus'
        '400':
          description: Missing task_id
        '404':
          description: The task belongs to another connection
  /projects/{project_id}/connections/{connection_id}/set-file-type-rules/:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: connection_id
        in: path
        required: true
        description: UUID of the connection
        schema:
          type: string
          format: uuid
    post:
      operationId: setConnectionFileTypeRules
      tags:
        - Connectors
      summary: Set the file-type allow/deny rules for a connection
      description: |
        Stores the connection's file-type rules (any provider). Rules gate creation of NEW
        documents from the next sync: `allow` imports only the listed extensions, `deny`
        imports everything except them. Already-imported documents keep receiving updates
        and delete-propagation regardless of rules. File types the platform can't parse
        (audio/video, .xml, .url, …) are always skipped (platform baseline, independent of
        these rules). New connections are created with an `allow` rule for document types. Extensions are normalized
        (lowercased, leading dots stripped, deduplicated). Only the connection owner may
        call this.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionFileTypeRules'
      responses:
        '200':
          description: Updated connection (rules stored under `params.file_type_rules`)
        '400':
          description: Invalid extension, or `allow` mode with an empty list (would block everything)
        '403':
          description: Not the connection owner
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        Use `Authorization: Bearer <token>`. The token is either a user token / OAuth access
        token, or a service-account API key (`cfk_...`). A key is valid on every endpoint and
        acts as its service account, an organization member with per-store permissions.
        Refused keys answer 403 with `Invalid API key.`, `API key revoked.`,
        `API key expired.` or `API key disabled.`.
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Use Authorization: Token <token>'
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      description: UUID of the project
      schema:
        type: string
        format: uuid
    DocumentId:
      name: document_id
      in: path
      required: true
      description: UUID of the document
      schema:
        type: string
        format: uuid
    ConversationId:
      name: conversation_id
      in: path
      required: true
      description: UUID of the conversation
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      description: Maximum number of results per page
      schema:
        type: integer
        default: 100
        minimum: 1
        maximum: 1000
    Offset:
      name: offset
      in: query
      description: Number of results to skip for pagination
      schema:
        type: integer
        default: 0
        minimum: 0
    ImpersonateEmail:
      name: X-Impersonate-Email
      in: header
      required: false
      description: |
        Email of the user to impersonate. Requires `CAN_IMPERSONATE_OTHER_USERS` permission.
        If the target user is not found or does not have access to the project, the request
        proceeds as the authenticated user. Contact Clarifeye to enable this permission.
      schema:
        type: string
        format: email
    ToolId:
      name: tool_id
      in: path
      required: true
      description: UUID of the tool
      schema:
        type: string
        format: uuid
    TableId:
      name: table_id
      in: path
      required: true
      description: UUID of the table
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notification_id
      in: path
      required: true
      description: UUID of the notification
      schema:
        type: string
        format: uuid
    FlowId:
      name: flow_id
      in: path
      required: true
      description: UUID of the extraction flow
      schema:
        type: string
        format: uuid
    PipelineRunId:
      name: pipeline_run_id
      in: path
      required: true
      description: UUID of the pipeline run
      schema:
        type: string
        format: uuid
    ExtractorId:
      name: extractor_id
      in: path
      required: true
      description: UUID of the extractor
      schema:
        type: string
        format: uuid
    ArtifactSlug:
      name: slug
      in: path
      required: true
      description: Slug of the artifact within the project's catalog
      schema:
        type: string
  schemas:
    ConversationTurnPoll:
      type: object
      description: |
        In-flight turn state returned by the async `send_message` (202) and `poll`
        endpoints for playground and Work-with-Clara conversations.
      properties:
        id:
          type: string
          format: uuid
        turn_status:
          type: string
          enum: [idle, running, failed]
          description: Lifecycle of the current chat turn
        turn_error:
          type: string
          description: Failure detail when turn_status is failed (empty otherwise)
        turn_events:
          type: array
          description: |
            Accumulated message-level events for the current turn. Each item mirrors
            a former SSE frame: `{type_streaming, payload}` where type_streaming is
            one of streaming_in_progress, streaming_error, streaming_completed, or
            quick_replies_ready (Clara only).
          items:
            type: object
            properties:
              type_streaming:
                type: string
              payload:
                type: object
        updated_at:
          type: string
          format: date-time
          description: Last activity timestamp; doubles as the turn staleness heartbeat
    ConnectionSelectionItem:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: Provider item id (Graph drive-item id / Drive file id)
        name:
          type: string
        drive_id:
          type: string
          nullable: true
          description: SharePoint document library the item lives in (null = site default)
    ConnectionFileTypeRules:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [allow, deny]
          description: allow = only import the listed types; deny = import everything except them
        extensions:
          type: array
          maxItems: 100
          items:
            type: string
            description: Bare file extension, e.g. "pdf" (leading dot tolerated on input)
    ImportPreview:
      type: object
      description: Dry-run diff of what starting an import would do with a selection.
      properties:
        to_create:
          type: integer
        to_update:
          type: integer
        unchanged:
          type: integer
          description: Already-synced files the import will skip as up to date.
        to_delete:
          type: integer
          nullable: true
          description: Null when truncated — a partial enumeration cannot prove deletions.
        total_remote:
          type: integer
          description: Distinct files enumerated under the selection (post-dedupe)
        truncated:
          type: boolean
          description: True when an enumeration budget (items/requests/time) was hit
        cap:
          type: integer
          description: The file cap in force
    ImportPreviewStatus:
      type: object
      required: [state, counted]
      properties:
        state:
          type: string
          enum: [pending, running, done, failed]
        counted:
          type: integer
          description: Files found so far (running) or in total (done)
        result:
          $ref: '#/components/schemas/ImportPreview'
          description: Present when state is done
        error:
          type: string
          description: Present when state is failed
    ImportProgress:
      type: object
      description: |
        Live progress of a running connector import, exposed on the connection resource as
        `import_progress`. Empty object when no import is running.
      properties:
        stage:
          type: string
          enum: [queued, syncing, downloading, finalizing]
        done:
          type: integer
          description: Files processed so far (downloading stage only)
        total:
          type: integer
          description: Total files to process (downloading stage only)
        updated_at:
          type: string
          format: date-time
    MCPServer:
      type: object
      description: A knowledge-store-level external MCP server registration. Secrets are never returned.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
          description: Immutable after creation.
        auth_mode:
          type: string
          enum: [oauth, api_key, none]
        is_enabled:
          type: boolean
        enabled_for_chat:
          type: boolean
          description: Available to internal playground chat agents (default true).
        enabled_for_tasks:
          type: boolean
          description: Available to CMA Task agents (default true).
        enabled_for_work_with_clara:
          type: boolean
          description: Available to Work-with-Clara agents (default true).
        tool_catalog:
          type: array
          description: Synced tools; each is {name, description, annotations, input_schema}.
          items:
            type: object
        enabled_tools:
          type: array
          description: Allowlist of tool names exposed to agents (all disabled by default).
          items:
            type: string
        oauth_client_id:
          type: string
        last_synced_at:
          type: string
          format: date-time
          nullable: true
        last_sync_error:
          type: string
        created_at:
          type: string
          format: date-time
    MCPServerCreate:
      type: object
      description: Fields for creating a server. The client secret is write-only.
      required:
      - name
      - url
      - auth_mode
      properties:
        name:
          type: string
        url:
          type: string
        auth_mode:
          type: string
          enum: [oauth, api_key, none]
        is_enabled:
          type: boolean
        enabled_for_chat:
          type: boolean
        enabled_for_tasks:
          type: boolean
        enabled_for_work_with_clara:
          type: boolean
        enabled_tools:
          type: array
          items:
            type: string
        oauth_client_id:
          type: string
        oauth_client_secret:
          type: string
          writeOnly: true
    MCPServerUpdate:
      type: object
      description: >-
        Editable fields for a server. ``url`` and ``auth_mode`` are immutable and cannot
        be changed after creation. The client secret is write-only.
      properties:
        name:
          type: string
        is_enabled:
          type: boolean
        enabled_for_chat:
          type: boolean
        enabled_for_tasks:
          type: boolean
        enabled_for_work_with_clara:
          type: boolean
        enabled_tools:
          type: array
          items:
            type: string
        oauth_client_id:
          type: string
        oauth_client_secret:
          type: string
          writeOnly: true
    UserMCPConnection:
      type: object
      description: >-
        A user's credential for one external MCP server URL (account-scoped, no secrets
        exposed). All non-`none` modes are per-user. A synthesized row (a server the user
        could connect but hasn't) has a null `id` and status `not_connected`.
      properties:
        id:
          type: string
          format: uuid
          nullable: true
        normalized_url:
          type: string
        status:
          type: string
          enum: [connected, expired, revoked, error, not_connected]
        auth_mode:
          type: string
          enum: [oauth, api_key, none]
          nullable: true
          description: Auth mode of the servers using this URL; null for an orphaned connection.
        has_api_key:
          type: boolean
          description: True when this is an api_key connection with a key stored.
        server_names:
          type: array
          items:
            type: string
          description: Names of the enabled servers (across the user's stores) that use this URL.
        store_names:
          type: array
          items:
            type: string
        in_use:
          type: boolean
          description: False when no enabled server in any of the user's stores still references this URL.
        connected_at:
          type: string
          format: date-time
          nullable: true
        last_refreshed_at:
          type: string
          format: date-time
          nullable: true
        token_expires_at:
          type: string
          format: date-time
          nullable: true
    Interview:
      type: object
      description: A structured interview conversation, including its full transcript.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          nullable: true
          description: Interview title (auto-generated from the topic when not provided).
        created_by:
          type: string
          format: uuid
          readOnly: true
          description: UUID of the user who created the interview.
        created_by_email:
          type: string
          format: email
          nullable: true
          readOnly: true
          description: Email of the user who created the interview (the importer, for imported interviews).
        type:
          type: string
          description: |
            Conversation type: "interview" (standard mono-topic), "guided-interview"
            (a multi-topic deep-dive whose ordered topics come from the sent draft or
            assign payload; its focus text lives in
            `type_additional_parameters.interview_focus`), or "imported-interview"
            (a read-only transcript of an interview recorded outside the platform,
            created via the import-transcript endpoint).
        type_additional_parameters:
          type: object
          description: Free-form parameters associated with the conversation type.
        chat_history:
          type: array
          description: Ordered list of transcript entries (messages, tool calls, etc.).
          items:
            type: object
        chat_participants:
          type: object
          readOnly: true
          description: |
            Users who submitted at least one user turn, keyed by user id (each user entry
            carries a `user_id`). Can differ from `assigned_to` when an admin finishes an
            interview assigned to someone else.
          additionalProperties:
            type: object
            properties:
              email:
                type: string
                format: email
        chat_memory:
          type: object
          description: Assistant memory state accumulated over the conversation.
        local_documents:
          type: array
          readOnly: true
          description: |
            Files attached to this interview (ordered by upload time). Only the id, name and
            source are included; resolve a fresh signed download URL via the project-level
            local-documents detail endpoint. Both `uploaded` files and `generated` files
            (produced by an agent in the conversation) can be imported into the Sources
            library.
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              source:
                type: string
                enum: [uploaded, generated]
        assigned_to:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: UUID of the assigned user (null while a pending invite has not yet joined).
        assigned_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: UUID of the user who created the assignment.
        assigned_to_email:
          type: string
          format: email
          nullable: true
          readOnly: true
          description: Assignee email, falling back to the invite email for not-yet-joined invitees.
        assigned_by_email:
          type: string
          format: email
          nullable: true
          readOnly: true
        is_pending_invite:
          type: boolean
          readOnly: true
          description: True when assigned to someone who has not yet joined the project.
        invite_config:
          allOf:
          - $ref: '#/components/schemas/InterviewInviteConfig'
          nullable: true
          readOnly: true
        interview_focus:
          type: object
          nullable: true
          readOnly: true
          description: |
            The seeded interview topic and optional specific questions, for rendering the
            in-chat intro card. Null for non-interviews and interviews without a topic.
            For guided interviews this is read from
            `type_additional_parameters.interview_focus` (they have no focus issue).
          properties:
            topic:
              type: string
            instructions:
              type: string
              description: |
                Guided interviews only: the organiser's rules for how Clara runs the
                session (read from `type_additional_parameters.interview_instructions`).
                Interviewer-only — never included in invitation emails or shown on the
                respondent's screen. Empty when none were set.
            questions:
              type: array
              items:
                type: string
        topics:
          type: array
          readOnly: true
          description: |
            Guided interviews only: the ordered topic agenda seeded at send time,
            with per-topic progress. Empty for every other interview type.
          items:
            type: object
            properties:
              topic_id:
                type: string
                format: uuid
                description: The topic row's id (the value `jump_to_topic_id` takes on a test run).
              title:
                type: string
              description:
                type: string
              status:
                type: string
                enum:
                - open
                - resolved
                - dismissed
                - skipped
                description: |
                  "open" while the topic still has to be covered; "resolved" or
                  "dismissed" once it no longer is. The interview auto-completes
                  when no topic is left open. "skipped" (test runs only): the tester
                  deliberately left the topic out — a choice, not a gap.
              skill_id:
                type: string
                nullable: true
                description: Standard-guide skill backing the topic; null for custom topics.
        campaign:
          allOf:
          - $ref: '#/components/schemas/InterviewCampaignRef'
          nullable: true
          readOnly: true
          description: Campaign this interview belongs to; null for ad hoc interviews.
        campaign_id:
          type: string
          format: uuid
          nullable: true
          writeOnly: true
          description: |
            PATCH-only: move the interview to another campaign of the project (or
            null to remove it from its campaign), so past interviews can be
            re-bucketed retroactively.
        campaign_name:
          type: string
          writeOnly: true
          description: |
            PATCH-only alternative to `campaign_id`: move the interview to the
            campaign with this name, creating it if the project has none (matched
            case-insensitively). `campaign_id` wins when both are sent.
        is_first_interview:
          type: boolean
          readOnly: true
          description: |
            True while the requesting user has never started an assigned interview in this
            project. Drives the intro card's expanded "how it works" explainer.
        import_info:
          allOf:
          - $ref: '#/components/schemas/ImportedInterviewInfo'
          nullable: true
          readOnly: true
        meeting_info:
          allOf:
          - $ref: '#/components/schemas/MeetingInfo'
          nullable: true
          readOnly: true
        conversation_summary:
          type: string
          readOnly: true
          description: Background-generated summary of the conversation ("" until generated).
        feedback_state:
          type: string
          readOnly: true
          enum:
          - none
          - submitted
          description: |
            Whether the interviewee has rated this interview. Drives whether the
            post-interview feedback prompt is shown. The grade and comment
            themselves are Clarifeye-internal and are never returned.
        test_run:
          allOf:
          - $ref: '#/components/schemas/InterviewTestRun'
          nullable: true
          readOnly: true
          description: |
            Set when this conversation is a test run of an unsent draft (CLA-1834);
            null for real interviews. Adds `draft_id`, `draft_name`, `draft_edit_url`.
        available_translations:
          type: array
          readOnly: true
          description: |
            ISO codes of the languages this transcript has a complete cached machine
            translation in (see the `translate` / `translations` endpoints). The
            translated text itself is never part of the interview payload.
          items:
            type: string
        language:
          type: string
          nullable: true
          readOnly: true
          description: |
            ISO language code the assigner set for this interview (null = adapt to the
            respondent). Fixed by the assign / test-run endpoints; the respondent's own
            choice goes through `respondent_language`.
        respondent_language:
          type: string
          nullable: true
          description: |
            ISO language code the respondent picked for this interview — on the type-or-talk
            card before Clara's first message (CLA-1884), or later from the language selector
            (CLA-1933). Outranks every other language candidate for both the text prompt and
            the voice agent; never written back to the user's preference. A change applies to
            the next typed reply or the next call (a call in progress keeps its language).
            PATCHable only by the person answering or a project admin (403 otherwise), and
            only until the interview is completed (400 otherwise). Null clears it
            (auto-detect); unsupported codes are rejected (400).
        default_language:
          type: string
          nullable: true
          readOnly: true
          description: |
            Detail payload only. The ISO code the interview would be conducted in for the
            requesting user if `respondent_language` is left alone — respondent pick, else
            the user's preferred language, else their org-membership language, else
            `language`; null when nothing resolves (Clara mirrors the respondent).
        live_voice_available:
          type: boolean
          nullable: true
          readOnly: true
          description: |
            Detail payload only (CLA-1784). Whether the organization owning THIS knowledge
            store may take interviews as calls: the instance-wide `LIVE_VOICE_ENABLED` +
            ElevenLabs key ANDed with the org's `allow_live_voice`. Store-scoped, unlike the
            `instance_flags.live_voice_enabled` twin on the user payload, which answers for
            the reader's *active* org — a respondent who also belongs to an org of their own
            has a different one. Null outside detail payloads; treat null as "not asked",
            never as "off". `POST .../voice-call/` returns 503 when this is false.
        status:
          type: string
          nullable: true
          readOnly: true
          enum:
          - pending
          - in_progress
          - completed
          description: Null for imported interviews until their transcript parse completes.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    InterviewTranscriptTranslation:
      type: object
      description: |
        Cached machine translation of an interview transcript into one language.
        `translations` maps a message key to the translated text of that transcript
        bubble.

        The key is a 16-hex-character (zero-padded, lower-case) FNV-1a 64 hash over the
        UTF-8 bytes of `role + US + speaker + US + content`, where `US` is the ASCII
        unit separator (code point 31) and `speaker` is the empty string when absent.
        Keys are computed from `chat_history` entries of type `message` with role
        `user` or `assistant`, excluding panel-bound entries (`to: "panel"`) and blank
        content, so identical bubbles share one key and a cache survives an in-progress
        interview growing. Bubbles without an entry are not translated yet.
      properties:
        language:
          type: string
          description: ISO language code of the translation.
        status:
          type: string
          enum:
          - running
          - ready
          - failed
        translations:
          type: object
          additionalProperties:
            type: string
          description: Message key → translated text.
        translated_count:
          type: integer
          description: Current transcript messages that have a translation.
        total_count:
          type: integer
          description: Current transcript messages eligible for translation.
        error:
          type: string
          nullable: true
          description: Stable failure message when `status` is `failed`; retry by calling `translate` again (already translated messages are kept).
        updated_at:
          type: string
          format: date-time
    MeetingInfo:
      type: object
      description: |
        Set on conversations of type `meeting` — the transcript of a call Clara attended
        as a bot (CLA-1843). The conversation is created post-call, so this block is always
        complete when present. Every turn of such a transcript is `role: user` with a
        `speaker` name and a `meeting_offset_ms`; attribute by speaker.
      properties:
        meeting_id:
          type: string
          format: uuid
        platform:
          type: string
          enum: [google_meet, zoom, microsoft_teams]
        participants:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              is_host:
                type: boolean
        duration_ms:
          type: integer
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        url:
          type: string
          nullable: true
          description: Relative in-app path of the meeting page (recording, insights).
    Meeting:
      type: object
      description: A meeting Clara attends (or attended) as a bot (CLA-1843).
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
          nullable: true
          description: The transcript conversation (type `meeting`); null until the call is over and transcribed.
        open_insights:
          type: object
          description: Active insights per kind (`contradiction`, `question`, `action`, `takeaway`).
          additionalProperties:
            type: integer
        project:
          type: string
          format: uuid
        created_by_email:
          type: string
          format: email
          nullable: true
        source:
          type: string
          enum: [link, calendar]
        platform:
          type: string
          enum: [google_meet, zoom, microsoft_teams]
        meeting_url:
          type: string
        title:
          type: string
        brief:
          type: string
          description: What the meeting is about (markdown); Clara prepares from it before the call.
        context_updated_at:
          type: string
          format: date-time
          nullable: true
        documents:
          type: array
          description: Context documents attached to the meeting (`local-documents/` route).
          items:
            $ref: '#/components/schemas/InterviewReferenceDocument'
        documents_warning:
          type: string
          nullable: true
        shared_with_count:
          type: integer
          description: Other stores' meetings served by the same bot.
        calendar_event_id:
          type: string
          format: uuid
          nullable: true
        language:
          type: string
          example: fr
          description: |
            ISO code of the meeting's main language. Clara's live transcription is told it
            and `secondary_languages` (open-ended detection mislabels short utterances); the
            post-call transcript is re-run over the whole recording without them.
        secondary_languages:
          type: array
          items:
            type: string
          maxItems: 3
          example: [en]
          description: Other languages the conversation may switch to; never the main one.
        scheduled_start:
          type: string
          format: date-time
          nullable: true
        scheduled_end:
          type: string
          format: date-time
          nullable: true
        join_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [scheduled, joining, waiting_room, in_call_not_recording, recording, ended, processing, ready, failed, cancelled]
        last_status_sub_code:
          type: string
        error:
          type: string
          description: User-facing note when something went wrong ("" otherwise).
        is_live:
          type: boolean
        participants:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              is_host:
                type: boolean
        screenshare_events:
          type: array
          items:
            type: object
        call_started_at:
          type: string
          format: date-time
          nullable: true
        call_ended_at:
          type: string
          format: date-time
          nullable: true
        transcript_ready_at:
          type: string
          format: date-time
          nullable: true
        last_segment_at:
          type: string
          format: date-time
          nullable: true
        realtime_degraded:
          type: boolean
          description: Recording but no live transcript for too long.
        recording_url:
          type: string
          nullable: true
          description: Signed inline URL of our MP4 copy, once copied. Detail only; always null in list responses.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MeetingCreate:
      type: object
      required: [meeting_url]
      properties:
        meeting_url:
          type: string
          description: Google Meet, Zoom or Microsoft Teams link, as given.
        title:
          type: string
          maxLength: 300
        brief:
          type: string
          maxLength: 20000
        scheduled_start:
          type: string
          format: date-time
          nullable: true
          description: |
            When the meeting itself starts. Clara is scheduled to join two minutes before it,
            so a store can prepare a meeting ahead of time without connecting a calendar.
            Omitted, or already past, means join now.
        language:
          type: string
          example: fr
          description: |
            ISO code of the meeting's main language, for Clara's live transcription. Omitted,
            the organisation's `meeting_language`, else the creator's preferred language, else
            English. 400 when unsupported.
        secondary_languages:
          type: array
          items:
            type: string
          maxItems: 3
          nullable: true
          description: |
            Other languages the conversation may switch to. Omitted (or null), the
            organisation's `meeting_secondary_languages` when its `meeting_language` is the
            default used, else none. 400 when unsupported or more than 3.
        entry_point:
          type: string
          enum: [ui, mcp]
          default: ui
          description: Analytics only — which surface created the meeting.
    MeetingUpdate:
      type: object
      properties:
        title:
          type: string
          maxLength: 300
        brief:
          type: string
          maxLength: 20000
        language:
          type: string
          example: fr
          description: |
            ISO code of the main language for the live transcription. Only while the meeting
            is `scheduled`: the booked bot is updated with it, and once Clara is on her way to
            the call the change is refused with 409.
        secondary_languages:
          type: array
          items:
            type: string
          maxItems: 3
          description: Other languages the call may switch to. Same rules as `language`.
    MeetingTranscriptSegment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        participant_id:
          type: string
        speaker:
          type: string
        text:
          type: string
        start_ms:
          type: integer
        end_ms:
          type: integer
        started_at:
          type: string
          format: date-time
          nullable: true
    MeetingInsight:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ref:
          type: integer
          description: Stable per-meeting number the agent refers to when updating or resolving.
        kind:
          type: string
          enum: [summary, contradiction, question, action, takeaway]
        title:
          type: string
        body:
          type: string
        anchor_ms:
          type: integer
          nullable: true
          description: Transcript offset the insight was raised from; null for pre-call insights.
        source:
          type: string
          description: The store artifact the insight is grounded on, when any.
        status:
          type: string
          enum: [active, resolved, superseded, dismissed]
        resolution_reason:
          type: string
        asked_at:
          type: string
          format: date-time
          nullable: true
          description: When the administrator marked the question as asked.
        asked_at_ms:
          type: integer
          nullable: true
          description: Transcript position at that moment; Clara looks for the answer from here.
        run_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MeetingInsightsResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/MeetingInsight'
        updated_at:
          type: string
          format: date-time
          nullable: true
        has_context:
          type: boolean
          description: A brief or documents were given (without them Clara stays conservative).
        tokens:
          type: object
          properties:
            input:
              type: integer
            output:
              type: integer
        running:
          type: boolean
        last_run_status:
          type: string
          nullable: true
        last_run_error:
          type: string
        auto_passes_remaining:
          type: integer
        can_refresh:
          type: boolean
    MeetingCalendarConnection:
      type: object
      properties:
        id:
          type: string
          format: uuid
        platform:
          type: string
          enum: [google_calendar, microsoft_outlook]
        platform_email:
          type: string
        status:
          type: string
          enum: [connecting, connected, needs_reconnect, disconnected]
        status_detail:
          type: string
        last_synced_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    MeetingCalendarEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        meeting_url:
          type: string
        meeting_platform:
          type: string
          nullable: true
          enum: [google_meet, zoom, microsoft_teams, null]
        attendees:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              email:
                type: string
        self_response:
          type: string
        meeting_id:
          type: string
          format: uuid
          nullable: true
          description: The scheduled meeting in this store, when Clara already joins.
        scheduled_elsewhere:
          type: array
          description: Names of other stores where Clara already joins this event.
          items:
            type: string
    ImportedInterviewInfo:
      type: object
      description: |
        Parse-pipeline state of an imported external transcript (interviews of type
        "imported-interview"). Null on every other interview type. The raw pasted
        transcript is never returned — the parsed `chat_history` is the transcript.
      properties:
        import_status:
          type: string
          enum:
          - parsing
          - ready
          - failed
          description: |
            "parsing" while the async parse runs (transcript not yet readable),
            "ready" once chat_history holds the speaker-labeled turns (status becomes
            "completed"), "failed" when parsing errored (use retry-import).
        participants:
          type: array
          description: Participant names (importer-supplied or inferred from the transcript).
          items:
            type: string
        interview_date:
          type: string
          format: date
          nullable: true
          description: Date the conversation happened (importer-supplied or inferred).
        error:
          type: string
          nullable: true
          description: Failure detail when import_status is "failed".
    GuidedInterviewTopicSkill:
      type: object
      description: One guided-interview topic type, as offered by the new-interview form.
      required:
      - id
      - label
      - description
      - selectable
      properties:
        id:
          type: string
          example: use_case_exploration
        label:
          type: string
          example: Concrete cases
        description:
          type: string
        selectable:
          type: boolean
          description: Whether a human may pick this type for a topic in the form.
    GuidedInterviewTopic:
      type: object
      description: |
        One ordered topic of a guided interview. `title` and `description` say what THIS
        topic must cover; `skill_id` is its TYPE — how the interviewer works it — and
        round-trips through edits, so preserve the values you received or the topic loses
        its skill-backed interview depth. Accepted values are the interview skills
        (`use_case_exploration`, `use_case_context`, `document_library`,
        `document_upload`, `checklist`, `custom_topic`, `guided_wrap_up`, plus ids retired from new
        agendas but still carried by older drafts); an unrecognized id is rejected with
        400. Omit `skill_id` for a free-form topic, driven by its own title/description
        text — such a topic must then carry a non-empty `description` (400 otherwise);
        a skill-backed topic may leave it blank.
      required:
      - title
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
        skill_id:
          type: string
          nullable: true
    InterviewDraftInput:
      type: object
      description: |
        Writable fields of an interview draft. Everything is optional — drafts are
        deliberately permissive and only sending (assign with `draft_id`) enforces
        the real assignment rules.
      properties:
        name:
          type: string
          description: |
            The draft's title, carried by every interview it sends. Setting it marks
            the name as custom (`name_is_custom`), so topic changes no longer
            regenerate it; an empty string goes back to a title generated from the topic.
        topic:
          type: string
          description: |
            The interview focus. When set, a short title is generated from it unless the
            draft has a custom `name`.
        instructions:
          type: string
          maxLength: 4000
          description: |
            Guided drafts only: optional rules for HOW Clara runs the session — how
            thorough to be, moves to avoid, item-by-item passes, the shape of the close.
            Read by the interviewer only; never part of the invitation email, the
            notification, or the respondent's screen (the focus is what respondents see).
            Partial by design: where an instruction conflicts with Clara's default
            interviewing rules the instruction wins; where it is silent the defaults
            apply. Non-empty on a legacy `interview` draft is rejected (400).
        interview_type:
          type: string
          enum:
          - interview
          - guided-interview
          default: interview
          description: |
            Which conversation type the draft fans out to when sent. Set at creation
            (form type cards, or the scoping conversation's draft tool) and immutable
            afterwards — updates that change it are rejected (400).
        questions:
          type: array
          description: |
            Optional specific topics or questions (max 10). Rejected on
            guided-interview drafts — their `topics` structure the conversation.
          items:
            type: string
        topics:
          type: array
          description: |
            Guided drafts only (rejected otherwise): the ordered, editable topics the
            interview walks through (max 12). The scoping conversation's draft tool
            pre-seeds them from the standard guide.
          items:
            $ref: '#/components/schemas/GuidedInterviewTopic'
        assignee_ids:
          type: array
          description: UUIDs of project members to interview. May go stale; re-validated at send.
          items:
            type: string
            format: uuid
        invite_emails:
          type: array
          description: Emails of people not yet on the project. Nobody is contacted until the draft is sent.
          items:
            type: string
            format: email
        language:
          type: string
          nullable: true
          description: |
            ISO language code (e.g. `fr`) offered to each recipient as the interview
            language; they can change it for their own interview when they start. Null (the
            default) offers each recipient their own preferred language. Unsupported codes
            are rejected (400).
        custom_message:
          type: string
          description: Optional note replacing the default invitation email copy.
        custom_focus:
          type: string
          nullable: true
          description: |
            Overrides the "what it's about" focus block in invitation emails without
            changing the interview focus. Null (the default) shows the topic truncated
            to a teaser; empty string removes the block; text is shown verbatim.
          maxLength: 500
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/InterviewArtifactSelection'
          description: |
            Knowledge-store artifacts whose content the interviewer gets in her prompt,
            each with whether the respondent can also open it. Empty (the default) means
            none — the interviewer then knows only the focus, topics and reference
            documents. Slugs are normalised (trimmed, lowercased, first pick kept); an
            unknown or out-of-scope slug is rejected (400). Resolved at interview time
            against the latest versions, so an artifact removed from scope later simply
            drops out. Replacing the list replaces the visibility too.
        scheduled_send_at:
          type: string
          format: date-time
          nullable: true
        reminders_enabled:
          type: boolean
          default: false
        reminder_start_after_days:
          type: integer
          minimum: 1
          maximum: 30
          default: 2
        reminder_interval_days:
          type: integer
          minimum: 1
          maximum: 30
          default: 3
        reminder_max_count:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
        source_agent_session_id:
          type: string
          format: uuid
          nullable: true
          writeOnly: true
          description: |
            Creation only: the CMA Clara session drafting this (passed by the agent via
            the MCP `draft_interviews` tool). Must be one of the caller's own Clara
            sessions scoped to this project, else 400. Ignored on update. In-process
            Clara records its conversation directly; both read back as `source_session`.
        campaign_id:
          type: string
          format: uuid
          nullable: true
          writeOnly: true
          description: |
            Existing campaign (of the same project) to group the draft's interviews
            under; null removes the draft from its campaign. Wins over
            `campaign_name` when both are sent.
        campaign_name:
          type: string
          writeOnly: true
          description: |
            Campaign to group the draft's interviews under, by name: reuses the
            project's campaign with that name (case-insensitive) or creates it.
    InterviewArtifactSelection:
      type: object
      required:
      - slug
      properties:
        slug:
          type: string
          description: An in-scope artifact slug.
        show_to_respondent:
          type: boolean
          default: false
          description: |
            Whether the respondent can also open this artifact, read-only, beside the chat
            (`GET .../interviews/{id}/artifacts/`). False keeps it as the interviewer's
            background only.
    InterviewDraft:
      allOf:
      - $ref: '#/components/schemas/InterviewDraftInput'
      - type: object
        description: |
          A saved, unsent interview-assignment payload. Becomes one interview per
          recipient when sent via the assign endpoint (with `draft_id`), which
          also deletes the draft.
        properties:
          id:
            type: string
            format: uuid
            readOnly: true
          name:
            type: string
            description: |
              The draft's title: generated from the topic at save time unless set by
              hand; empty when the draft has no topic and no custom name (clients show
              "Untitled draft interview").
          name_is_custom:
            type: boolean
            readOnly: true
            description: True once the draft was named by hand; topic changes then keep its name.
          assignee_emails:
            type: array
            readOnly: true
            description: |
              Emails of the member recipients in `assignee_ids`, same order; ids that
              are no longer users are left out.
            items:
              type: string
              format: email
          campaign:
            allOf:
            - $ref: '#/components/schemas/InterviewCampaignRef'
            nullable: true
            readOnly: true
            description: |
              Campaign the interviews created from this draft will belong to; null
              when none. Set via `campaign_id` / `campaign_name`.
          test_runs:
            type: array
            readOnly: true
            description: This draft's test runs, newest first (see `InterviewTestRun`).
            items:
              $ref: '#/components/schemas/InterviewTestRun'
          source_session:
            allOf:
            - $ref: '#/components/schemas/InterviewDraftSourceSession'
            nullable: true
            readOnly: true
          reference_documents:
            type: array
            readOnly: true
            description: |
              Documents the interviewer attached to frame the interview (CLA-1887),
              oldest first. Managed through `interview-drafts/{id}/local-documents/`.
            items:
              $ref: '#/components/schemas/InterviewReferenceDocument'
          reference_documents_warning:
            type: string
            nullable: true
            readOnly: true
            description: |
              Warn-only guidance when the attached set is very long or large (more than 5
              documents, or about 300k characters in total); null otherwise. Never blocks.
          artifact_selection_warning:
            type: string
            nullable: true
            readOnly: true
            description: |
              Warn-only guidance when the selected artifacts are large (about 200k
              characters in total); null otherwise. Never blocks.
          created_by:
            type: string
            format: uuid
            nullable: true
            readOnly: true
          created_by_email:
            type: string
            format: email
            nullable: true
            readOnly: true
          created_at:
            type: string
            format: date-time
            readOnly: true
          updated_at:
            type: string
            format: date-time
            readOnly: true
    InterviewDraftSummary:
      type: object
      description: |
        Overview row of a draft (`view=summary` on the list, CLA-1950). Empty values
        are omitted.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        interview_type:
          type: string
        language:
          type: string
        campaign:
          type: string
          description: Campaign name.
        created_by_email:
          type: string
          format: email
        focus_preview:
          type: string
          description: The draft's `topic`, cut to 200 characters.
        topic_titles:
          type: array
          items:
            type: string
        recipients:
          type: array
          description: Member recipients' emails, then `invite_emails`.
          items:
            type: string
            format: email
        reference_document_count:
          type: integer
        artifact_count:
          type: integer
        test_run_count:
          type: integer
        latest_test_run:
          type: object
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
            draft_changed_since_start:
              type: boolean
        updated_at:
          type: string
          format: date-time
    InterviewReferenceDocument:
      type: object
      description: Summary of one reference document on a draft (a `LocalDocument` whose source is `reference`).
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        processing_status:
          type: string
          description: pending → … → completed | failed. The draft cannot be sent or tested until every document is completed or failed.
        source_document:
          type: string
          format: uuid
          nullable: true
          description: The Sources document it was copied from, when picked from the library.
        character_count:
          type: integer
        page_count:
          type: integer
          nullable: true
        size_warning:
          type: string
          nullable: true
          description: Warn-only guidance for a long document (about 150k characters or more); null otherwise.
        created_at:
          type: string
          format: date-time
          nullable: true
    ReferenceDocumentsAttachResult:
      type: object
      properties:
        attached:
          type: array
          items:
            $ref: '#/components/schemas/LocalDocument'
        skipped:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
                nullable: true
              reason:
                type: string
    InterviewTestRun:
      type: object
      description: |
        A rehearsal of an unsent draft (CLA-1834): an ordinary interview conversation
        the admin plays through themselves, listed only under its draft and removed
        with it. Topics in `skipped_topic_ids` were deliberately left out of the run
        (started later / jumped ahead) — they are choices, not gaps. On a conversation
        detail (`test_run`) the object additionally carries `draft_id`, `draft_name`,
        `draft_edit_url`, `draft_source_session` and a `note` for agent readers.
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          nullable: true
          enum:
          - pending
          - in_progress
          - completed
        language:
          type: string
          nullable: true
          description: ISO code the run is conducted in (outranks the tester's preference); null = auto-detect.
        started_from_topic_index:
          type: integer
        started_from_topic_title:
          type: string
          nullable: true
        skipped_topic_ids:
          type: array
          items:
            type: string
            format: uuid
        jumps:
          type: array
          items:
            type: object
            properties:
              from_topic_id:
                type: string
                format: uuid
                nullable: true
              to_topic_id:
                type: string
                format: uuid
              at_message_count:
                type: integer
        message_count:
          type: integer
          description: Conversation-detail flavour only (drafts list runs without their transcripts).
        draft_changed_since_start:
          type: boolean
          description: |
            The draft's interview-shaping fields (focus, topics, questions, language)
            changed after this run began — it rehearsed a previous version. Re-saving the
            draft unchanged, or starting another run, does not set it.
        interview_url:
          type: string
          description: Absolute URL of the run's focused interview page.
        draft_source_session:
          allOf:
          - $ref: '#/components/schemas/InterviewDraftSourceSession'
          nullable: true
          description: Conversation-detail flavour only. The session that drafted the interview, so the test page can resume it for feedback.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LocalDocument:
      type: object
      description: |
        A file attached to a conversation, agent settings, agent session, or interview
        draft. `source` says who produced it: `uploaded` (a user, in the conversation),
        `generated` (the agent), or `reference` (the interviewer, before the interview —
        CLA-1887). Signed file URLs are short-lived.
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        name:
          type: string
        file:
          type: string
          description: Signed inline URL of the stored file.
        type:
          type: string
          enum:
          - agent_settings
          - conversation
          - coach_conversation
          - agent_session
          - cross_store_conversation
          - interview_draft
        agent_settings:
          type: string
          format: uuid
          nullable: true
        conversation:
          type: string
          format: uuid
          nullable: true
        coach_conversation:
          type: string
          format: uuid
          nullable: true
        agent_session:
          type: string
          format: uuid
          nullable: true
        cross_store_conversation:
          type: string
          format: uuid
          nullable: true
        interview_draft:
          type: string
          format: uuid
          nullable: true
        source_document:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: The Sources document a reference document was copied from, when applicable.
        claude_file_id:
          type: string
          nullable: true
        source:
          type: string
          enum:
          - uploaded
          - generated
          - reference
          readOnly: true
        document_text:
          type: string
        summary_text:
          type: string
        short_summary_text:
          type: string
        processing_status:
          type: string
          readOnly: true
        page_count:
          type: integer
          nullable: true
          readOnly: true
        character_count:
          type: integer
          readOnly: true
        preview_pdf_url:
          type: string
          nullable: true
          readOnly: true
          description: Signed URL of the PDF that previews the file (itself for PDFs, the parser's rendition for Office files). Only populated on the interview-draft and coach-conversation local-document routes, where a viewer renders it; null everywhere else.
        size_warning:
          type: string
          nullable: true
          readOnly: true
        version_number:
          type: integer
          nullable: true
        total_versions:
          type: integer
          nullable: true
    InterviewDraftSourceSession:
      type: object
      description: |
        The Clara session that created a draft (provenance, SET_NULL on both ends).
        `kind` decides the route a client builds: `clara_fast` = in-process Work with
        Clara conversation (`/agent/clara-fast?conversation_id=`), `cma` = Managed-Agents
        Clara session (`/agent/clara?session_id=`), `coach` = any other coach
        conversation (e.g. scoping), recorded but not linked from the test page.
      properties:
        kind:
          type: string
          enum:
          - clara_fast
          - cma
          - coach
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
    InterviewCampaignRef:
      type: object
      description: Nested campaign reference carried by interviews and drafts.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    InterviewCampaign:
      type: object
      description: |
        A named group of interviews (a "wave"), with the progress aggregates the
        interviews page renders. Counts cover every interview in the campaign.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Unique within the project, case-insensitively.
        created_at:
          type: string
          format: date-time
          readOnly: true
        interview_count:
          type: integer
          readOnly: true
          description: |
            Total interviews in the campaign. May exceed the sum of the per-status
            counts: interviews created before statuses existed have none.
        completed_count:
          type: integer
          readOnly: true
        in_progress_count:
          type: integer
          readOnly: true
        pending_count:
          type: integer
          readOnly: true
          description: Assigned but not yet started.
        latest_activity:
          type: string
          format: date-time
          readOnly: true
          description: |
            Most recent update across the campaign's interviews, falling back to
            the campaign's own creation date when it has none. Interview
            timestamps also move on background writes (summaries, turn state), so
            treat this as approximate activity rather than message recency.
        assignees:
          type: array
          readOnly: true
          description: |
            Up to five recipient emails, for the avatar row. Self-assigned
            interviews contribute their creator.
          items:
            type: string
            format: email
        assignee_count:
          type: integer
          readOnly: true
          description: Total distinct recipients, which may exceed `assignees` length.
    InterviewFeedItem:
      type: object
      description: One row of the interviews feed — a campaign or a standalone interview.
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - campaign
          - interview
        campaign:
          $ref: '#/components/schemas/InterviewCampaign'
          description: Present when `kind` is `campaign`.
        interview:
          $ref: '#/components/schemas/InterviewListItem'
          description: Present when `kind` is `interview`.
    InterviewInviteConfig:
      type: object
      description: |
        Invitation-email customization and reminder schedule for an assigned interview.
        Null for self-assigned interviews, non-interview conversations, and interviews
        created before this feature existed.
      readOnly: true
      properties:
        custom_message:
          type: string
          description: The assigner's note; replaces the default invitation email copy when set.
        custom_focus:
          type: string
          nullable: true
          description: |
            The assigner's override of the email's "what it's about" focus block. Null
            means not customised (emails show the truncated topic); empty string means
            the block was removed; text is shown verbatim.
        scheduled_send_at:
          type: string
          format: date-time
          nullable: true
          description: When the invitation email is (or was) due to be sent. Null means it was sent immediately.
        invitation_email_sent_at:
          type: string
          format: date-time
          nullable: true
          description: When the invitation email actually went out; null while a scheduled send is still pending.
        reminders_enabled:
          type: boolean
        reminder_start_after_days:
          type: integer
        reminder_interval_days:
          type: integer
        reminder_max_count:
          type: integer
        reminders_sent:
          type: integer
          description: Automatic reminders sent so far (manual reminders are not counted).
        next_reminder_at:
          type: string
          format: date-time
          nullable: true
          description: When the next automatic reminder is due; null when none is scheduled.
        reminders_stopped:
          type: boolean
          description: True once an admin/assigner stopped the schedule via stop-reminders.
    InterviewListItem:
      type: object
      description: Lightweight interview representation used in list responses (omits the transcript).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          nullable: true
        created_by:
          type: string
          format: uuid
          readOnly: true
        created_by_email:
          type: string
          format: email
          nullable: true
          readOnly: true
        type:
          type: string
        assigned_to:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        assigned_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        assigned_to_email:
          type: string
          format: email
          nullable: true
          readOnly: true
        assigned_by_email:
          type: string
          format: email
          nullable: true
          readOnly: true
        is_pending_invite:
          type: boolean
          readOnly: true
        invite_config:
          allOf:
          - $ref: '#/components/schemas/InterviewInviteConfig'
          nullable: true
          readOnly: true
        import_info:
          allOf:
          - $ref: '#/components/schemas/ImportedInterviewInfo'
          nullable: true
          readOnly: true
        meeting_info:
          allOf:
          - $ref: '#/components/schemas/MeetingInfo'
          nullable: true
          readOnly: true
        status:
          type: string
          nullable: true
          readOnly: true
          enum:
          - pending
          - in_progress
          - completed
          description: Null for imported interviews until their transcript parse completes.
        campaign:
          allOf:
          - $ref: '#/components/schemas/InterviewCampaignRef'
          nullable: true
          readOnly: true
          description: Campaign this interview belongs to; null for ad hoc interviews.
        first_message_preview:
          type: string
          description: |
            Truncated preview of the first user message in the transcript. For imported
            transcripts this is the parse-generated summary when available (the literal
            first turn of a meeting export is usually greeting noise).
        message_count:
          type: integer
          description: Number of conversational messages in the transcript.
        topics_total:
          type: integer
          readOnly: true
          description: |
            Number of guided topics on the interview ("3/7 topics" progress on list
            rows). 0 for interviews without guided topics.
        topics_done:
          type: integer
          readOnly: true
          description: Guided topics no longer open (resolved or dismissed).
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PaginatedResponse:
      type: object
      properties:
        count:
          type: integer
          description: Total number of results
        next:
          type: string
          format: uri
          nullable: true
          description: URL to next page of results
        previous:
          type: string
          format: uri
          nullable: true
          description: URL to previous page of results
        results:
          type: array
          items: {}
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
      example:
        error: User not found
    ProvisioningConfig:
      type: object
      properties:
