        schema:
          $ref: '#/components/schemas/FeedbackStatus'
      - name: sentiment
        in: query
        description: |
          Which sentiment bucket to return. `actionable` means negative **or** neutral —
          everything that is work to review. Feedback submitted without `is_positive` is
          neutral, so filtering on `is_positive=false` alone hides it. An unknown value is
          a 400.
        schema:
          type: string
          enum:
          - actionable
          - positive
          - all
      - name: is_positive
        in: query
        description: Filter by raw sentiment; overrides `sentiment` when both are given. Prefer `sentiment`.
        schema:
          type: boolean
      - name: conversation
        in: query
        description: Only feedback linked to this playground conversation
        schema:
          type: string
          format: uuid
      - name: query_id
        in: query
        description: Only feedback about this chat message (used to restore thumb state)
        schema:
          type: integer
      - name: search
        in: query
