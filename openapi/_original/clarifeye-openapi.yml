          example:
            id: department
            label: Department
            children:
              - id: legal
                label: Legal
                children: []
              - id: finance
                label: Finance
                children: []
        extraction_prompt:
          type: string
          example: "Choose the department this chunk most likely belongs to."
        tag_level:
