openapi: 3.2.0
info:
  title: Clarifeye Platform API — Full API Documentation Feedback API
  description: 'Complete REST API reference for the Clarifeye Platform.


    Documents every endpoint exposed by the platform — the public surface plus

    the advanced surface: pipeline customization (extraction flows, pipeline

    runs, warehouse tables, document tag/metadata configuration), the pre-MCP

    AI surface (agent settings, playground conversations, conversation-scoped

    feedback views, notifications), and the impersonation header. New AI

    integrations should consume knowledge via MCP rather than the

    conversation/agent-settings endpoints documented here.


    ## Authentication

    All endpoints require authentication. Include the Authorization header in every request using either format:

    - `Authorization: Token `

    - `Authorization: Bearer `


    ## Service accounts and API keys

    Integrations authenticate with an **API key** of a **service account**:

    - `Authorization: Bearer ` (keys start with `cfk_`)


    A service account is an ordinary member (role `member`) of one organization that cannot log

    in. Organization admins create it and mint its keys on the organization''s *Service

    accounts* page (`/organizations/{id}/service-accounts/`, `/organization-api-keys/`), and

    give it access to knowledge stores with ordinary store permissions. A key is valid on every

    endpoint and acts as its service account: it reaches exactly the stores, with exactly the

    rights, the account was given. An account can hold several keys (each with its own name,

    optional expiry and revocation), so a key can be rotated without changing identity.


    A refused key answers **403** with one of: `Invalid API key.`, `API key revoked.`,

    `API key expired.`, `API key disabled.` (the service account is disabled).


    Any valid key may also call `POST /organizations/{id}/provision-user/` and

    `POST /organizations/{id}/deprovision-user/` for its own organization (the `{id}` in the

    path must be the key''s organization). The email domains these may pre-create accounts for

    are configured by Clarifeye on the organization (`allowed_provisioning_domains`).


    ## Impersonation


    Certain endpoints support user impersonation for creating or listing data on behalf of other users.

    This is useful for integrating external systems that need to attribute actions to specific users.


    **Header:** `X-Impersonate-Email`


    **Required Permission:** `CAN_IMPERSONATE_OTHER_USERS` (for a person, contact Clarifeye to enable it; org admins grant it to a service account on the organization''s Service accounts page)


    **Behavior:**

    - If the header is provided and the impersonator has the required permission, the action is performed as the target user

    - If the target user is not found, the request proceeds as the original authenticated user

    - If the target user does not have access to the project, the request proceeds as the original authenticated user

    - If the impersonator lacks the `CAN_IMPERSONATE_OTHER_USERS` permission, the header is ignored


    **With an API key** the request fails instead (**403**) whenever impersonation cannot

    happen: missing permission, unknown target, target without access to the store, target that

    is itself a service account, or an endpoint outside a store. A key never silently acts as

    its own service account when impersonation was asked for.'
  version: 1.0.0
  contact:
    name: Clarifeye Support
servers:
- url: https://eu.app.clarifeye.ai/api/v1
  description: EU
- url: https://us.app.clarifeye.ai/api/v1
  description: US
security:
- BearerAuth: []
- TokenAuth: []
tags:
- name: Feedback
  description: Submit and review feedback — standalone (content-only), agent-submitted (MCP), or linked to a conversation message
paths:
  /projects/{project_id}/feedbacks/:
    get:
      tags:
      - Feedback
      summary: List feedback
      description: 'Retrieve all feedback for a project with optional filtering.


        **Access Control:**

        - Admins see all feedback in the project

        - Regular users see only feedback they submitted


        **Impersonation:**

        - When using impersonation, returns feedback submitted by the impersonated user


        **Sorting:**

        - Results are ordered by most recently updated first (`updated_at` field)


        **Note:** For grouped views by conversation, use `/projects/{project_id}/feedbacks/grouped_by_conversation/`'
      operationId: listFeedback
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ImpersonateEmail'
      - name: status
        in: query
        description: Filter by feedback status
        schema:
          $ref: '#/components/schemas/FeedbackStatus'
      - name: sentiment
        in: query
        description: 'Which sentiment bucket to return. `actionable` means negative **or** neutral —

          everything that is work to review. Feedback submitted without `is_positive` is

          neutral, so filtering on `is_positive=false` alone hides it. An unknown value is

          a 400.

          '
        schema:
          type: string
          enum:
          - actionable
          - positive
          - all
      - name: is_positive
        in: query
        description: Filter by raw sentiment; overrides `sentiment` when both are given. Prefer `sentiment`.
        schema:
          type: boolean
      - name: conversation
        in: query
        description: Only feedback linked to this playground conversation
        schema:
          type: string
          format: uuid
      - name: query_id
        in: query
        description: Only feedback about this chat message (used to restore thumb state)
        schema:
          type: integer
      - name: search
        in: query
        description: Search in feedback text or user email (case-insensitive)
        schema:
          type: string
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginatedResponse'
                - type: object
                  properties:
                    results:
                      type: array
                      description: Array of Feedback objects
                      items:
                        $ref: '#/components/schemas/Feedback'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Feedback
      summary: Submit feedback
      description: 'Submit feedback. The simplest form is direct feedback about content:

        just the feedback text and optional `context.additional_details`, with

        no conversation attached. Feedback can also be linked to a playground

        conversation message, or submitted by an agent through MCP.


        **Impersonation:**

        - When using impersonation, the feedback is submitted as the impersonated user


        ## Feedback Types


        | Type | is_positive Value | Description |

        |------|-------------------|-------------|

        | Thumbs up | `true` | Positive feedback |

        | Thumbs down | `false` | Negative feedback |

        | Neutral | `null` | Neutral or no sentiment |


        ## Query ID (conversation feedback only)


        The `query_id` identifies a specific user query and all related responses.

        It can be obtained from:

        - The streaming response (each message contains `query_id`)

        - The `streaming_completed` event''s `chat_history`

        - The conversation retrieval endpoint'
      operationId: submitFeedback
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ImpersonateEmail'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - context
              properties:
                feedback:
                  type: string
                  description: Text comment (can be empty for quick feedback)
                  example: We need to cover the EU refund rules in the knowledge base
                context:
                  anyOf:
                  - title: Direct feedback
                    description: 'Feedback about content itself, not linked to a

                      conversation. Just the feedback text plus optional

                      additional details. Agents submitting through MCP set

                      source=MCP and type=direct_feedback; plain API callers

                      can omit both.'
                    type: object
                    additionalProperties: true
                    properties:
                      additional_details:
                        type: string
                        description: 'Optional extra context provided alongside the

                          feedback. Displayed in the review UI. Do not include

                          user_query for this mode.'
                      source:
                        type: string
                        enum:
                        - MCP
                        description: Only set when submitted by an agent through MCP
                      type:
                        type: string
                        enum:
                        - direct_feedback
                  - title: Interaction feedback (MCP)
                    type: object
                    additionalProperties: true
                    required:
                    - source
                    properties:
                      source:
                        type: string
                        enum:
                        - MCP
                      type:
                        type: string
                        description: Feedback type (e.g. user_dissatisfaction, missing_playbook)
                        example: user_dissatisfaction
                      user_query:
                        type: string
                        description: The original user request the agent was answering (verbatim) — not the corrective/feedback message.
                        example: Generate document X
                  - title: Conversation feedback
                    type: object
                    required:
                    - conversation_id
                    - query_id
                    - source
                    properties:
                      conversation_id:
                        type: string
                        format: uuid
                        description: ID of the conversation
                      query_id:
                        type: integer
                        description: Query ID of the message to provide feedback on
                        example: 0
                      source:
                        type: string
                        enum:
                        - PlaygroundConversation
                        description: Source of the feedback
                is_positive:
                  type:
                  - boolean
                  - 'null'
                  description: '- `true`: Positive feedback (thumbs up)

                    - `false`: Negative feedback (thumbs down)

                    - `null`: Neutral feedback

                    '
                  example: true
            examples:
              direct_feedback:
                summary: Feedback with additional details (not linked to a conversation)
                value:
                  feedback: We need to cover the EU refund rules in the knowledge base
                  is_positive: false
                  context:
                    additional_details: Several customer calls last week asked about EU refunds and we had nothing to point them to.
              conversation_feedback:
                summary: Feedback on a playground conversation message
                value:
                  feedback: This answer was helpful and accurate
                  is_positive: true
                  context:
                    source: PlaygroundConversation
                    conversation_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    query_id: 0
      responses:
        '201':
          description: Feedback submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feedback'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /projects/{project_id}/feedbacks/{feedback_id}/:
    patch:
      tags:
      - Feedback
      summary: Update feedback status
      description: 'Mark feedback as reviewed or update other fields.


        **Access Control:**

        - Admins can update any feedback

        - Regular users can only update feedback they submitted


        **Impersonation:**

        - When using impersonation, the ownership check is performed against the impersonated user

        - This allows updating feedback submitted by the impersonated user'
      operationId: updateFeedback
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: feedback_id
        in: path
        required: true
        description: UUID of the feedback
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/ImpersonateEmail'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: '#/components/schemas/FeedbackStatus'
                feedback:
                  type: string
                  description: Updated feedback text
                is_positive:
                  type:
                  - boolean
                  - 'null'
                  description: Updated sentiment
      responses:
        '200':
          description: Feedback updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feedback'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden - user does not own this feedback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Feedback
      summary: Delete feedback
      description: 'Remove feedback.


        **Access Control:**

        - Admins can delete any feedback

        - Regular users can only delete feedback they submitted


        **Impersonation:**

        - When using impersonation, the ownership check is performed against the impersonated user

        - This allows deleting feedback submitted by the impersonated user'
      operationId: deleteFeedback
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: feedback_id
        in: path
        required: true
        description: UUID of the feedback
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/ImpersonateEmail'
      responses:
        '204':
          description: Feedback deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden - user does not own this feedback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/feedbacks/grouped_by_conversation/:
    get:
      tags:
      - Feedback
      summary: Get feedbacks grouped by conversation
      description: 'Retrieve feedbacks grouped by their associated playground conversation with unified pagination and sorting.


        **Access Control:**

        - Admins see all feedback in the project

        - Regular users see only feedback they submitted


        **Grouping Logic:**

        - Feedbacks are grouped by their `conversation` field (FK to PlaygroundConversation)

        - Conversation groups and ungrouped feedbacks are returned in a single flat array

        - Ungrouped feedbacks appear as single-item groups with `conversation_id: null`

        - Each group includes status counts and all associated feedbacks


        **Pagination:**

        - Paginates across the unified list of conversation groups and ungrouped feedbacks

        - Use `limit` and `offset` parameters to page through results

        - The `count` field reflects the total number of displayable groups (conversations + ungrouped)


        **Status Filtering:**

        - `status=to_review`: Groups with ANY unreviewed feedback

        - `status=reviewed`: Groups where ALL feedbacks are reviewed

        - No status filter: All groups


        **Sorting:**

        - All groups are sorted together by the most recent feedback update time

        - With `status=to_review`: Sorted by the most recent "to_review" feedback update

        - With `status=reviewed`: Sorted by the most recent "reviewed" feedback update

        - Without status filter: Sorted by the most recent feedback update (any status)

        - Feedbacks within each group are ordered by most recently updated first


        **Impersonation:**

        - When using impersonation, returns feedback submitted by the impersonated user'
      operationId: getGroupedFeedbacks
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ImpersonateEmail'
      - name: status
        in: query
        description: Filter by conversation status (based on feedback statuses)
        schema:
          $ref: '#/components/schemas/FeedbackStatus'
      - name: sentiment
        in: query
        description: 'Sentiment bucket, applied before the per-conversation counts are computed — so a

          conversation holding only positive feedback disappears from the review buckets

          rather than appearing with a count of zero. `actionable` is negative **or**

          neutral. An unknown value is a 400.

          '
        schema:
          type: string
          enum:
          - actionable
          - positive
          - all
      - name: search
        in: query
        description: Search in feedback text or user email (case-insensitive)
        schema:
          type: string
      - name: include_archived
        in: query
        description: Set to "true" to include feedbacks from archived conversations. Defaults to false.
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginatedResponse'
                - type: object
                  properties:
                    results:
                      type: array
                      description: 'Flat array of conversation groups and ungrouped feedbacks, sorted by last updated feedback.

                        Ungrouped feedbacks appear as single-item groups with `conversation_id: null`.

                        '
                      items:
                        $ref: '#/components/schemas/ConversationFeedbackGroup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/feedbacks/mark_conversation_reviewed/:
    post:
      tags:
      - Feedback
      summary: Mark all feedbacks in a conversation as reviewed
      description: 'Update the status of all feedbacks associated with a specific conversation to "reviewed".


        **Access Control:**

        - Admins can update all feedbacks in the project

        - Regular users can only update feedback they submitted


        **Impersonation:**

        - When using impersonation, only updates feedback submitted by the impersonated user'
      operationId: markConversationReviewed
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ImpersonateEmail'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - conversation_id
              properties:
                conversation_id:
                  type: string
                  format: uuid
                  description: ID of the conversation whose feedbacks should be marked as reviewed
                  example: 123e4567-e89b-12d3-a456-426614174000
                status:
                  allOf:
                  - $ref: '#/components/schemas/FeedbackStatus'
                  description: 'Status to apply. Defaults to `reviewed`; `to_review` reopens the whole

                    conversation. Positive feedback is never touched by this endpoint.

                    '
            example:
              conversation_id: 123e4567-e89b-12d3-a456-426614174000
      responses:
        '200':
          description: Feedbacks updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated_count:
                    type: integer
                    description: Number of feedbacks updated
                    example: 3
                  conversation_id:
                    type: string
                    format: uuid
                    description: ID of the conversation whose feedbacks were updated
                    example: 123e4567-e89b-12d3-a456-426614174000
                  new_status:
                    type: string
                    description: The new status that was applied to the feedbacks
                    example: reviewed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/feedbacks/counts/:
    get:
      tags:
      - Feedback
      summary: Get feedback counts by status
      description: 'Retrieve comprehensive counts of feedbacks split by status, conversation grouping, and ungrouped feedbacks.


        **Access Control:**

        - Admins see counts for all feedback in the project

        - Regular users see counts only for feedback they submitted


        **Impersonation:**

        - When using impersonation, returns counts for feedback submitted by the impersonated user'
      operationId: getFeedbackCounts
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ImpersonateEmail'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                description: 'Counts for the signals dashboard. "Actionable" means negative **or**

                  neutral: positive feedback is praise and never enters the review queue,

                  and a hand-written signal carries no sentiment yet is still work.

                  '
                properties:
                  total:
                    type: integer
                    description: Every visible feedback, any status or sentiment
                    example: 120
                  needs_review:
                    type: integer
                    description: Actionable feedback still at "to_review" — the work tile
                    example: 28
                  reviewed:
                    type: integer
                    description: Actionable feedback with status "reviewed"
                    example: 40
                  dismissed:
                    type: integer
                    description: Actionable feedback with status "dismissed"
                    example: 5
                  positive:
                    type: integer
                    description: Positive feedback, any status
                    example: 30
                  mine_to_review:
                    type: integer
                    description: Open work assigned to the caller
                    example: 3
                  unassigned_to_review:
                    type: integer
                    description: Open work with no assignee
                    example: 20
                  conversations_to_review:
                    type: integer
                    description: Conversations holding at least one actionable open feedback
                    example: 12
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      description: UUID of the project
      schema:
        type: string
        format: uuid
    Offset:
      name: offset
      in: query
      description: Number of results to skip for pagination
      schema:
        type: integer
        default: 0
        minimum: 0
    ImpersonateEmail:
      name: X-Impersonate-Email
      in: header
      required: false
      description: 'Email of the user to impersonate. Requires `CAN_IMPERSONATE_OTHER_USERS` permission.

        If the target user is not found or does not have access to the project, the request

        proceeds as the authenticated user. Contact Clarifeye to enable this permission.

        '
      schema:
        type: string
        format: email
    Limit:
      name: limit
      in: query
      description: Maximum number of results per page
      schema:
        type: integer
        default: 100
        minimum: 1
        maximum: 1000
  schemas:
    FeedbackStatus:
      type: string
      enum:
      - to_review
      - reviewed
      - dismissed
      description: "- `to_review`: Feedback pending review (default). Setting this on a closed\n  feedback reopens it and clears `reviewed_at`/`reviewed_by`.\n- `reviewed`: Feedback has been reviewed\n- `dismissed`: Closed without action (won't fix, or archived praise)\n"
    ConversationFeedbackGroup:
      type: object
      description: A group of feedbacks from the same playground conversation
      properties:
        conversation_id:
          type: string
          format: uuid
          description: ID of the playground conversation
        conversation_title:
          type: string
          description: Title of the conversation
          example: Product pricing discussion
        conversation_created_at:
          type: string
          format: date-time
          description: When the conversation was created
        agent_name:
          type:
          - string
          - 'null'
          description: Name of the agent settings used in this conversation
          example: Customer Support Assistant
        conversation_is_archived:
          type: boolean
          description: Whether the associated conversation is archived
          default: false
        to_review_count:
          type: integer
          description: Number of feedbacks with status "to_review" in this conversation
          example: 3
        reviewed_count:
          type: integer
          description: Number of feedbacks with status "reviewed" in this conversation
          example: 1
        dismissed_count:
          type: integer
          description: Number of feedbacks with status "dismissed" in this conversation
          example: 0
        feedbacks:
          type: array
          description: All feedbacks from this conversation, ordered by most recently updated first (by `updated_at` field)
          items:
            $ref: '#/components/schemas/Feedback'
      example:
        conversation_id: 123e4567-e89b-12d3-a456-426614174000
        conversation_title: Product pricing discussion
        conversation_created_at: '2026-03-01T10:30:00Z'
        agent_name: Customer Support Assistant
        conversation_is_archived: false
        to_review_count: 3
        reviewed_count: 1
        feedbacks:
        - id: abc-123
          status: to_review
          feedback: The answer was inaccurate
          is_positive: false
        - id: abc-124
          status: to_review
          feedback: This needs more detail
          is_positive: false
        - id: abc-125
          status: to_review
          feedback: Missing citation for this claim
          is_positive: false
        - id: abc-126
          status: reviewed
          feedback: Great explanation!
          is_positive: true
        status_summary: mixed
        feedback_count: 4
        latest_updated_at: '2026-02-26T10:30:00Z'
        has_unreviewed: true
    PaginatedResponse:
      type: object
      properties:
        count:
          type: integer
          description: Total number of results
        next:
          type:
          - string
          - 'null'
          format: uri
          description: URL to next page of results
        previous:
          type:
          - string
          - 'null'
          format: uri
          description: URL to previous page of results
        results:
          type: array
          items: {}
    Feedback:
      type: object
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        given_by:
          type: object
          description: User who submitted the feedback
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email
        status:
          $ref: '#/components/schemas/FeedbackStatus'
        feedback:
          type: string
          description: Feedback text comment
        context:
          type: object
          additionalProperties: true
          description: 'Free-form context, echoed back as submitted at creation.

            Conversation feedback carries conversation_id/query_id/source;

            MCP interaction feedback carries user_query; direct feedback may

            carry additional_details.'
          properties:
            conversation_id:
              type: string
              format: uuid
              deprecated: true
              description: Use the top-level `conversation` field instead
            query_id:
              type: integer
              description: Query ID of the message the feedback is about (conversation feedback)
            source:
              type: string
              description: PlaygroundConversation, MCP, or absent for direct API feedback
            user_query:
              type: string
              description: The original user request the agent was answering (MCP interaction feedback)
            additional_details:
              type: string
              description: Extra context provided alongside the feedback (direct feedback)
        is_positive:
          type:
          - boolean
          - 'null'
          description: '- `true`: Positive feedback

            - `false`: Negative feedback

            - `null`: Neutral

            '
        user_message:
          type: string
          description: The user message that was responded to (computed field)
        conversation_title:
          type: string
          description: Title of the conversation (computed field)
        suggested_action_type:
          type:
          - string
          - 'null'
          description: Auto-generated suggested action type
        suggested_action_data:
          type: object
          description: Auto-generated suggested action data
        reviewed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When the feedback was closed. Cleared on reopen. Null for feedback closed

            before this field existed.

            '
        reviewed_by:
          type:
          - object
          - 'null'
          description: User who closed it (null when closed by an unattended agent)
          properties:
