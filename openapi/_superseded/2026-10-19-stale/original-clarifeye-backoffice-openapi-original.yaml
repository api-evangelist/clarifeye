  /projects/{project_id}/feedbacks/grouped_by_conversation/:
    get:
      tags:
        - Feedback
      summary: Get feedbacks grouped by conversation
      description: >
        Retrieve feedbacks grouped by their associated playground conversation
        with unified pagination and sorting.


        **Access Control:**

        - Admins see all feedback in the project

        - Regular users see only feedback they submitted


        **Grouping Logic:**

        - Feedbacks are grouped by their `conversation` field (FK to
        PlaygroundConversation)

        - Conversation groups and ungrouped feedbacks are returned in a single
        flat array

        - Ungrouped feedbacks appear as single-item groups with
        `conversation_id: null`

        - Each group includes status counts and all associated feedbacks


        **Pagination:**

        - Paginates across the unified list of conversation groups and ungrouped
        feedbacks

        - Use `limit` and `offset` parameters to page through results

        - The `count` field reflects the total number of displayable groups
        (conversations + ungrouped)


        **Status Filtering:**

        - `status=to_review`: Groups with ANY unreviewed feedback

        - `status=reviewed`: Groups where ALL feedbacks are reviewed

        - No status filter: All groups


        **Sorting:**

        - All groups are sorted together by the most recent feedback update time

        - With `status=to_review`: Sorted by the most recent "to_review"
        feedback update

        - With `status=reviewed`: Sorted by the most recent "reviewed" feedback
        update

        - Without status filter: Sorted by the most recent feedback update (any
        status)

        - Feedbacks within each group are ordered by most recently updated first


        **Impersonation:**

        - When using impersonation, returns feedback submitted by the
        impersonated user
      operationId: getGroupedFeedbacks
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ImpersonateEmail'
        - name: status
          in: query
          description: Filter by conversation status (based on feedback statuses)
          schema:
            $ref: '#/components/schemas/FeedbackStatus'
        - name: search
          in: query
          description: Search in feedback text or user email (case-insensitive)
          schema:
            type: string
        - name: include_archived
          in: query
          description: >-
            Set to "true" to include feedbacks from archived conversations.
            Defaults to false.
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      results:
                        type: array
                        description: >
                          Flat array of conversation groups and ungrouped
                          feedbacks, sorted by last updated feedback.

                          Ungrouped feedbacks appear as single-item groups with
                          `conversation_id: null`.
                        items:
                          $ref: '#/components/schemas/ConversationFeedbackGroup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
