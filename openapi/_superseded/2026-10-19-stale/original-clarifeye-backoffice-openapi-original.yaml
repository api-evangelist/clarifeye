              required:
                - context
              properties:
                feedback:
                  type: string
                  description: Text comment (can be empty for quick feedback)
                  example: This answer was helpful and accurate
                context:
                  type: object
                  required:
                    - conversation_id
                    - query_id
                    - source
                  properties:
                    conversation_id:
                      type: string
                      format: uuid
                      description: ID of the conversation
                    query_id:
                      type: integer
                      description: Query ID of the message to provide feedback on
                      example: 0
                    source:
                      type: string
                      enum:
                        - PlaygroundConversation
                      description: Source of the feedback
                is_positive:
                  type: boolean
                  nullable: true
                  description: |
                    - `true`: Positive feedback (thumbs up)
                    - `false`: Negative feedback (thumbs down)
                    - `null`: Neutral feedback
                  example: true
