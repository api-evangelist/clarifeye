generated: '2026-07-18'
method: searched
status: published
source: https://docs.clarifeye.ai/guides/mcp
server:
  name: clarifeye
  transport: http
  urls:
  - region: EU
    url: https://eu.app.clarifeye.ai/mcp
  - region: US
