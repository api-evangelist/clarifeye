note: >
  Clarifeye's OAuth surface backs the hosted MCP server, not the REST API
  (the REST OpenAPI declares only Bearer token / Token apiKey auth). Scopes
  are enumerated by the OAuth authorization-server discovery document and by
  the MCP authentication guide. Dynamic Client Registration (RFC 7591) is
  supported at /o/register/; PKCE S256 required.
