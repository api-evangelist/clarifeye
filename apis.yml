aid: clarifeye
name: Clarifeye
description: >-
  Clarifeye is an AI-native knowledge infrastructure platform that captures the
  undocumented knowledge locked in people's heads. Its AI interviewer, Clara,
  runs document-aware interviews with subject-matter experts, surfaces
  contradictions, and structures the results into versioned, reusable knowledge
  artifacts — briefs, playbooks, mental maps, and ontologies. That captured
  knowledge is exposed to AI clients such as Claude, ChatGPT, and Microsoft
  Copilot through a hosted Model Context Protocol (MCP) server and a REST API,
  so agents answer grounded in an organization's own logic with references back
  to source. Clarifeye targets regulated industries where undocumented processes
  create key-person risk, offers EU and US data localization with PII redaction
  at ingestion, and is SOC 2 Type II certified. Backed by EQT Ventures.
